  case: grounding-en-001
  answers:
    en:
      status: answered
      refusal_reason: null
      answer: |-
        Under the UAE Labour Law, a female worker is entitled to 60 days of maternity leave: the first 45 days on full pay and the following 15 days on half pay.

        If she or her child is ill as a result of pregnancy or childbirth, she may take up to 45 additional days without pay, proven by a medical certificate. The employer must also pay her a one-off maternity allowance of one month's basic wage when she returns, and she may convert the 45 unpaid days into paid leave if she has worked for the employer for more than two years.

        This is not legal advice.
      citations:
        - {instrument: labour-law, article: "30"}
