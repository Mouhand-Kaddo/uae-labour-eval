  case: grounding-ar-002
  answers:
    ar:
      status: answered
      refusal_reason: null
      answer: |-
        بموجب المادة (51) من قانون العمل، يستحق العامل الأجنبي بدوام كامل الذي أكمل سنة أو أكثر من الخدمة المستمرة مكافأة نهاية الخدمة على أساس الأجر الأساسي: أجر (21) يوماً عن كل سنة من السنوات الخمس الأولى، وأجر (30) يوماً عن كل سنة مما زاد على ذلك.

        غير أن المكافأة تختلف عند الاستقالة: فمن يستقيل بعد أكثر من خمس سنوات وأقل من عشر سنوات يستحق ثلثي المكافأة فقط، ولا يستحق كامل المكافأة إلا من أنهى صاحب العمل خدمته أو من استقال بعد عشر سنوات. وبما أنك استقلت بعد سبع سنوات، فتستحق ثلثي المكافأة.

        هذه المعلومات ليست استشارة قانونية.
      citations:
        - {instrument: labour-law, article: "51"}
