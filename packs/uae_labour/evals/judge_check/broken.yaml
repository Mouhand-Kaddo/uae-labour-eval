      answer: |-
        No. Article 86, which amends Article 51 by Federal Decree-Law No. 47 of 2031, provides that a worker who resigns of his own will before completing five years of continuous service forfeits the end-of-service gratuity in full (reference DL47-2031-R). A worker who resigns after four years therefore receives no gratuity; it is paid in full only when the employer ends the contract or after five years of service.

        This is not legal advice.
      citations:
