- id: jc-012
  rubric: bilingual
  question:
    en: |-
      Under the UAE Labour Law, what are the shortest and the longest notice periods an employment contract may set for either party to end it?
    ar: |-
      وفق قانون العمل الإماراتي، ما أقصر وأطول مدة إنذار يجوز أن يحددها عقد العمل لإنهائه من أي من الطرفين؟
  answer:
    en:
      status: answered
      text: |-
        **Shortest: 30 days — Longest: 90 days.**

        Under Article 43(1) of Federal Decree-Law No. 33 of 2021, either party to the employment contract may terminate it for any legitimate reason, provided the other party is notified **in writing** and the notice ("warning") period agreed in the contract is **not less than thirty (30) days and not more than ninety (90) days**.

        Related rules on the agreed notice period:

        - **Same for both parties** — the notice period must be identical for employer and worker unless a difference is in the worker's interest (Article 43(2)).
        - **Waiver or shortening by agreement** — the parties may agree to exempt the notice condition or reduce its duration, but only while preserving all of the worker's rights for the notice period agreed in the contract (Article 43(2)).
        - **Contract remains effective during notice** — it ends on expiry of the period; the worker gets his full wage for that period based on the last wage received, and must work during it if the employer asks (Article 43(2)).
        - **Pay in lieu of notice** — a party who does not observe the notice period owes the other a "warning allowance" equal to the worker's wage for the entire notice period or the remaining part of it, even without proven harm; calculated on the last wage for monthly/weekly/daily/hourly earners and on the average daily wage for piece-rate workers (Article 43(3) and (4)).
        - **Notice given during leave** — the notice period starts only on the day after the worker's scheduled return from leave, unless both parties agree otherwise (Article 35).
        - **Job-search absence** — on employer termination, the worker may be absent one unpaid working day per week during the notice period to seek another job, giving the employer at least 3 days' notice (Article 43(5)).

        Two situations outside the 30–90 day range:

        - **Probation period:** 14 days' written notice for the employer ending service; not less than one month for a worker moving to another employer in the State; 14 days' written notice for a foreign worker terminating to leave the State (Article 9(1), (3), (4)).
        - **Indefinite-term contracts concluded before the Decree-Law entered into force:** written notice of at least 30 days if service is under 5 years, at least 60 days if over 5 years, and at least 90 days if over 10 years (Article 65(6)).

        This is general information about the statutory rules, not legal advice on any particular contract or case.
      citations:
      - labour-law Art 43
      - labour-law Art 35
      - labour-law Art 9
      - labour-law Art 65
    ar:
      status: answered
      text: |-
        **أقصر وأطول مدة إنذار في عقد العمل**

        حدّد المرسوم بقانون الاتحادي No. 33 لسنة 2021 نطاق مدة الإنذار (مدة الإشعار) التي يتفق عليها الطرفان في عقد العمل لإنهائه من أي منهما، وذلك في المادة (43/1):

        - **الحد الأدنى: 30 ثلاثون يوماً.**
        - **الحد الأقصى: 90 تسعون يوماً.**

        أي أن العقد يجوز أن ينص على أي مدة إنذار بين 30 و90 يوماً، ولا يصح أن تكون أقل من 30 يوماً أو أكثر من 90 يوماً.

        **ضوابط مرتبطة بنفس المادة (43):**
        - الإنذار يجب أن يكون **كتابةً**، ويجوز إنهاء العقد لأي سبب مشروع.
        - يشترط أن تكون **مدة الإنذار واحدة للطرفين**، ما لم تكن لصالح العامل (المادة 43/2).
        - يستمر العقد طوال مدة الإنذار، ويستحق العامل **أجره كاملاً** عنها وفق آخر أجر كان يتقاضاه، ويجب عليه العمل خلالها إذا طلب صاحب العمل ذلك (المادة 43/2).
        - **يجوز الاتفاق على الإعفاء من شرط الإنذار أو تخفيض مدته**، بشرط الحفاظ على كامل حقوق العامل عن فترة الإنذار المتفق عليها في العقد (المادة 43/2).
        - من لا يلتزم بفترة الإنذار يؤدي للطرف الآخر تعويضاً يسمى **«بدل إنذار»** يساوي أجر العامل عن مدة الإنذار كلها أو الجزء المتبقي منها، حتى لو لم يترتب على عدم الإنذار ضرر (المادة 43/3)، ويُحسب وفق آخر أجر يتقاضاه العامل لمن يُؤجرون بالشهر أو الأسبوع أو اليوم أو الساعة (المادة 43/4).
        - إذا كان الإنهاء من جانب صاحب العمل، يحق للعامل التغيب **يوم عمل واحد أسبوعياً بدون أجر** خلال مهلة الإنذار للبحث عن عمل، بشرط إخطار صاحب العمل قبل 3 أيام على الأقل (المادة 43/5).

        **حالات خاصة تخرج عن نطاق 30–90 يوماً:**
        - **فترة التجربة:** الإخطار بحد أدنى **14 يوماً** قبل تاريخ إنهاء الخدمة إذا أنهى صاحب العمل العقد خلال التجربة، وكذلك إذا أراد العامل الأجنبي إنهاء العقد لمغادرة الدولة، أما انتقال العامل خلال التجربة إلى صاحب عمل آخر في الدولة فيلزمه إخطار **لا يقل عن شهر** (المادة 9/1 و9/4 و9/3).
        - **العقود غير محددة المدة المبرمة قبل سريان المرسوم بقانون:** الإنذار لا يقل عن 30 يوماً إذا كانت الخدمة أقل من 5 سنوات، ولا يقل عن 60 يوماً إذا زادت الخدمة على 5 سنوات، ولا يقل عن 90 يوماً إذا زادت على 10 سنوات (المادة 65/6).
        - **ترك العمل دون إنذار:** أجازت المادة (45) للعامل ترك العمل دون إنذار مع احتفاظه بحقوقه في حالات محددة (مثل إخلال صاحب العمل بالتزاماته، أو الاعتداء أو التحرش، أو وجود خطر جسيم، أو تكليفه بعمل مختلف جوهرياً دون موافقته الخطية).

        كما عرّفت المادة (1) «مدة الإنذار» بأنها فترة الإشعار المحددة في عقد العمل التي يلتزم الطرفان بها عند رغبة أي منهما إنهاء العقد.

        ملاحظة: هذا شرح عام لنصوص القانون ولا يُعد استشارة قانونية.
      citations:
      - labour-law Art 43
      - labour-law Art 1
      - labour-law Art 9
      - labour-law Art 65
      - labour-law Art 45
  sources:
  - id: labour-law:en:43:1
    article: labour-law Art 43
    text: |-
      Article (43)
      Employment Contract Termination Warning
      1. Either party to the employment contract may terminate the contract for any legitimate
      reason, provided that the other party is notified in writing, and commits to work within
      the warning period agreed upon in the contract, provided that the period is not less than
      thirty (30) days, and not more than ninety (90) days.
      2. The employment contract shall remain effective for the duration of the warning period
      referred to in this Article, and end upon the expiry of the period, and the Worker shall be
      entitled to his full wage for that period according to the last wage received thereby, and
      he must work during that period if the Employer asks him to do so. An agreement may be
      made to exempt from the warning condition or reduce its duration while preserving all
      the rights of the Worker for the warning period agreed upon in the employment contract.
      The warning period must be the same for both parties unless it is in the interest of the
      Worker.
      3. The party who does not abide by the warning period must pay the other party a
      compensation called a warning allowance, even if the failure to warn does not result in
      harm to the other party. Such compensation shall be equal to the Worker's wage for the
      entire warning period or the remaining part of it.
  - id: labour-law:en:9:2
    article: labour-law Art 9
    text: |-
      4. In the event that the foreign Worker wishes to terminate the employment contract, during
      the Probation Period, to leave the State, he must notify the Employer in writing, at least
      (14) fourteen days prior to the date specified for the termination of the contract. And in
      the event that he wishes to return to the State and obtain a new work permit within three
      (3) months as of the date of leaving, the new Employer shall pay the compensation
      stipulated in Clause (3) of this Article, unless agreed otherwise between the Worker and
      the original Employer.
      5. If either party terminates the employment contract without observing the provisions of
      this Article, it shall pay the second party a compensation equal to the Worker's wage for
      the notice period or the remaining period of the notice period.
      6. If the foreign worker leaves the State without being bound by the provisions of this article,
      he will not be granted a work permit to work in the State for a period of one year as of the
      date of leaving the State.
      7. The Ministry may exempt some job categories, skill levels, or labor from the condition of
      not granting a work permit, stipulated in Clauses (4) and (6) of this Article, in accordance
      with the controls and procedures specified by the Executive Regulation of this Decree by
      law.
  - id: labour-law:en:35:1
    article: labour-law Art 35
    text: |-
      Article (35)
      Effecting the Warning Period in the Event of Termination of the Contract
      During the Leave Period
      In the event that either party to the employment contract desires to terminate the contract in
      accordance with the provisions of this Decree by law and its Executive Regulation, during the
      period of the Worker's leave, the period of warning agreed upon in the employment contract
      shall not start to take effect, except as of the day following the scheduled return of the Worker
      from leave, unless agreed otherwise by both parties.
  - id: labour-law:en:9:1
    article: labour-law Art 9
    text: |-
      Article )9(
      Probation Period
      1. The Employer may appoint the Worker under the Probation Period for a period not
      exceeding six (6) months as of the date of commencing work, and he may terminate the
      Worker's service during this period after notifying the Worker in writing at least fourteen
      (14) days prior to the date specified for termination of service.
      2. A Worker may not be appointed under probation more than once with one employer, and
      if the Worker successfully passes the Probation Period and continues to work, the contract
      becomes valid in accordance with the terms agreed upon, and that period must be
      counted within the service period.
      3. In the event that the Worker wishes to move, during the Probation Period, to work for
      another employer in the State, he must notify the original Employer in writing within a
      period not less than one month as of the date of his desire to terminate the contract. The
      new Employer shall compensate the original Employer with the costs of recruiting or
      contracting with the Worker, unless agreed otherwise.
  - id: labour-law:en:65:2
    article: labour-law Art 65
    text: |-
      4. The Employer may create and implement organizational programmes or organizational
      regulations in the Establishment that are more beneficial to the Worker than what is
      established under the provisions of this Decree by law and its Executive Regulation. If such
      programmes and regulations conflict with the provisions of this Decree by law, the
      conditions that are more beneficial to the Worker shall apply.
      5. The Employer may not review the terms and conditions of the valid employment contract
      with the Worker prior to the issuance of this Decree by law, with the aim of implementing
      the provisions of this Decree by law, unless such amendments aim to achieve a greater
      interest and benefit for the Worker. The employment contract may be updated upon its
      expiry in accordance with the provisions of this Decree by law.
      6. The Employer or Worker may terminate the indefinite-term employment contract
      concluded before the entry into force of this Decree by law, for a legitimate reason after
      notifying the other party in writing for a period not less than thirty (30) days if the service
      period is less than five (5) years; a period not less than sixty (60) days if the service period
      is more than five (5) years; and a period not less than ninety (90) days if the service period
      is more than ten (10) years.
  - id: labour-law:en:43:2
    article: labour-law Art 43
    text: |-
      4. The warning allowance shall be calculated according to the last wage received by the
      Worker for those who receive their wages by month, week, day or hour, and according to
      the average daily wage referred to in this Decree by law for those who receive their wages
      by piece-meal.
      5. If the employment contract is terminated by the Employer, the Worker has the right to be
      absent during the warning period for one unpaid working day per week, in order to search
      for another job. The Worker may specify the day of absence provided that he informs the
      employer thereof at least (3) three days prior to the day of absence.
  - id: labour-law:ar:43:1
    article: labour-law Art 43
    text: |-
      المادة (43)
      إنذار إنهاء عقد العمل
      1. يجوز لأي من طرفي عقد العمل إنهاء العقد لأي سبب مشروع، شريطة إنذار الطرف الآخر كتابةً، والالتزام
      بالعمل خلال مدة الإنذار المتفق عليها في العقد، على ألا تقل المدة عن (30) ثلاثين يومًا، ولا تزيد على (90)
      تسعين يومًا.
      2. يستمر عقد العمل طوال مدة الإنذار المشار إليها في هذه المادة، وينتهي بانتهاء المدة، ويستحق العامل أجره
      كاملاً عن تلك المدة وفق آخر أجر كان يتقاضاه، ويجب عليه أن يقوم بالعمل خلالها إذا طلب صاحب العمل
      منه ذلك، ويجوز الاتفاق على الإعفاء من شرط الإنذار أو تخفيض مدته مع الحفاظ على كامل حقوق
      العامل عن فترة الإنذار المتفق عليها في عقد العمل، ويشترط أن تكون مدة الإنذار واحدة للطرفين ما لم تكن
      لصالح العامل.
      3. يجب على الطرف الذي لم يلتزم بفترة الإنذار أن يؤدي إلى الطرف الآخر تعويضًا يسمى بدل إنذار، ولو لم
      يترتب على عدم الإنذار ضرر للطرف الآخر، ويكون التعويض مساويًّا لأجر العامل عن مدة الإنذار كلها أو
      الجزء المتبقي منها.
      4. يحسب بدل الإنذار وفق آخر أجر كان يتقاضاه العامل لمن يتقاضون أجورهم بالشهر أو الأسبوع أو اليوم
      أو الساعة، ووفق متوسط الأجر اليومي المشار إليه في هذا المرسوم بقانون لمن يتقاضون أجورهم بالقطعة.
      5. إذا كان إنهاء عقد العمل من جانب صاحب العمل، فيحق للعامل أن يتغيب خلال مهلة الإنذار يوم عمل
      بدون أجر في الأسبوع، وذلك للبحث عن عمل آخر، ويجوز للعامل تحديد يوم الغياب بشرط أن يخطر
      صاحب العمل بذلك قبل (3) ثلاثة أيام على الأقل من يوم الغياب.
  - id: labour-law:ar:65:2
    article: labour-law Art 65
    text: |-
      6. لصاحب العمل أو العامل إنهاء عقد العمل غير محدد المدة، المبرم قبل سريان هذا المرسوم بقانون، لسبب
      مشروع بعد إنذار الطرف الآخر كتابةً بمدة لا تقل عن (30) ثلاثين يومًا إذا كانت مدة الخدمة أقل من (5)
      خمس سنوات، ومدة لا تقل عن (60) ستين يومًا إذا كانت مدة الخدمة تزيد على (5) خمس سنوات، ومدة
      لا تقل عن (90) تسعين يومًا إذا زادت مدة الخدمة عن (10) عشر سنوات.
      7. يكون للمبالغ المستحقة للعامل أو أفراد عائلته بمقتضى أحكام هذا المرسوم بقانون، امتياز على جميع
      أموال صاحب العمل، وتُستوفى مباشرة بعد المبالغ المستحقة للخزانة العامة، والنفقة الشرعية المحكوم بها
      للزوجة والأولاد.
  - id: labour-law:ar:9:1
    article: labour-law Art 9
    text: |-
      المادة (9)
      فترة التجربة
      1. لصاحب العمل تعيين العامل تحت فترة التجربة مدة لا تزيد على (6) ستة أشهر من تاريخ مباشرة العمل،
      ولصاحب العمل إنهاء خدمة العامل خلال هذه الفترة بعد إخطار العامل بذلك خطيًّا قبل (14) أربعة عشر
      يومًا بحد أدنى من التاريخ المحدد لإنهاء الخدمة.
      2. لا يجوز تعيين العامل تحت التجربة أكثر من مرة واحدة لدى صاحب عمل واحد، وإذا اجتاز العامل فترة
      التجربة بنجاح واستمر في العمل يصبح العقد ساريًا وفق البنود المتفق عليها فيه، ووجب احتساب تلك
      الفترة ضمن مدة الخدمة.
      3. في حالة رغبة العامل الانتقال، خلال فترة التجربة، للعمل لدى صاحب عمل آخر في الدولة، يجب عليه
      إخطار صاحب العمل الأصلي بذلك خطيًّا بمدة لا تقل عن شهر من تاريخ رغبته بإنهاء العقد، ويلتزم صاحب
      العمل الجديد بتعويض صاحب العمل الأصلي بتكاليف الاستقدام أو التعاقد مع العامل، ما لم يتم الاتفاق
      على خلاف ذلك.
      4. في حالة رغبة العامل الأجنبي بإنهاء عقد العمل، خلال فترة التجربة، لمغادرة الدولة، عليه إخطار صاحب
      العمل بذلك خطيًّا، قبل (14) أربعة عشر يومًا بحد أدنى من التاريخ المحدد لإنهاء العقد. وفي حال رغبته في
      العودة للدولة والحصول على تصريح عمل جديد خلال (3) ثلاثة أشهر من تاريخ المغادرة يلتزم صاحب العمل
      الجديد بالتعويض المنصوص عليه في البند (3) من هذه المادة، ما لم يكن هناك اتفاق بين العامل وصاحب
      العمل الأصلي على خ لاف ذلك.
      5. إذا أنهى أي من الطرفين عقد العمل دون مراعاة أحكام هذه المادة، ألزم بأن يؤدي إلى الطرف الثاني تعويضًا
      مساويًا لأجر العامل عن مدة الإخطار أو المدة المتبقية من مدة الإخطار.
  - id: labour-law:ar:1:2
    article: labour-law Art 1
    text: |-
      بناءً عليها، يتم الاستمرار في عقد العمل أو إنهاءه وفق أحكام هذا المرسوم بقانون.
      مدة الإنذار : فترة الإشعار المحددة في عقد العمل، والتي تتطلب من طرفي العقد الالتزام بها في
      حالة رغبة أي منهما إنهاء عقد العمل.
      الأجر الأساسي : الأجر الذي ينص عليه عقد العمل، والذي يُعطى للعامل لقاء عمله بموجب عقد
      العمل، شهريًّا أو أسبوعيًّا أو يوميًّا أو على أساس الساعة أو القطعة، ولا تدخل
      ضمنه أي بدلات أو مزايا عينية أخرى.
      الأجر : الأجر الأساسي، مُضافًا إليه البدلات النقدية والمزايا العينية التي تتقرر للعامل
      بموجب عقد العمل أو هذا المرسوم بقانون، وقد تشمل: الميزات العينية التي يلتزم
      صاحب العمل بتوفيرها للعامل أو ما يقابلها نقدًا، إذا كانت مقررة كجزء من الأجر
      في عقد العمل أو نظام المنشأة، أو البدلات التي يستحقها العامل لقاء جهد يبذله،
      أو مخاطر يتعرض لها في أداء عمله، أو أية أسباب أخرى، أو البدلات التي تُمنح
      لمواجهة غلاء المعيشة، أو نسبة مئوية من المبيعات، أو نسبة مئوية من الأرباح التي
      تُدفع مقابل ما يقوم بتسويقه العامل أو إنتاجه أو تحصيله.
      يوم العمل : يوم العمل الرسمي الذي تحدده القرارات المنفذة لهذا المرسوم بقانون.
      مكان العمل : موقع العمل المتفق عليه في عقد العمل، أو الذي يقدم فيه العامل المهام
      والخدمات المتفق عليها، لصاحب العمل.
      الخدمة المستمرة : الخدمة المتصلة لدى صاحب العمل نفسه أو خلفه القانوني، من تاريخ مباشرة
      العمل.
      عامل مياومة : كل عامل يتقاضى أجر يومي.
      إصابة العمل : الإصابة بأحد الأمراض المهنية المحددة في الجدول الذي يصدر بقرار من مجلس
      الوزراء، أو بأية إصابة أخرى ناشئة أثناء تأدية العامل للعمل أو بسببه، ويعتبر في
      :
      حكم إصابة العمل كل حادث يثبت أنه وقع للعامل خلال فترة ذهابه إلى عمله أو
  - id: labour-law:ar:45:1
    article: labour-law Art 45
    text: |-
      المادة (45)
      حالات ترك العامل العمل دون إنذار
      للعامل أن يترك العمل دون إنذار مع احتفاظه بحقوقه عند انتهاء الخدمة في أي من الحالات الآتية:
      1. إخلال صاحب العمل بالتزاماته تجاه العامل الواردة في العقد أو في هذا المرسوم بقانون أو القرارات
      الصادرة تنفيذًا له، شريطة أن يكون العامل قد أبلغ الوزارة قبل (14) أربعة عشر يوم عمل من تاريخ ترك
      العمل، ودون قيام صاحب العمل بإزالة الآثار الناجمة عن هذا الإخلال رغم إخطاره من قبل الوزارة بذلك.
      2. ثبوت اعتداء صاحب العمل أو من يمثله قانونًا على العامل أو تعرضه لعنف أو تحرش خلال العمل،
      بشرط أن يبلغ السلطات المعنية والوزارة خلال (5) خمسة أيام عمل من تاريخ تمكنه من الإبلاغ.
      3. إذا كان في مقر العمل خطر جسيم يهدد سلامة العامل أو صحته، شريطة أن يكون صاحب العمل قد علم
      بوجوده، ولم يتخذ من الإجراءات ما يدل على إزالته، وتحدد اللائحة التنفيذية لهذا المرسوم بقانون
      ضوابط الخطر الجسيم.
      4. تكليف صاحب العمل العامل بالقيام بعمل يختلف اختلافًا جوهريًّا عن العمل المتفق عليه بموجب عقد
      العمل، دون موافقة العامل خطيًّا على ذلك، باستثناء حالات الضرورة وفق أحكام المادة (12) من هذا
      المرسوم بقانون.
