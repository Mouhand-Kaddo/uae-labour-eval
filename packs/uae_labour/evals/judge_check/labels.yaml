- id: jc-009
  rubric: grounding
  question: |-
    I started my job eight months ago. How much annual leave does the UAE Labour Law give me for my service so far, and how much will I get once I have completed a full year?
  answer:
    status: answered
    text: |
      **Your annual leave accrual under the UAE Labour Law (full-time)**

      **1. Where you are now – 8 months of service: about 16 days**

      Article 29(1)(b) of Federal Decree-Law No. 33 of 2021 gives a worker whose service is "more than six months and less than one year" annual leave with full pay of **not less than two days for each month** of service. At eight months that is roughly **16 days** accrued so far.

      Running the statutory calculation on your facts (8 full months, treated as 243 days of service, using the rule in Article 67 that a month counts as 30 days) gives **16.2 days**. The fraction comes from pro-rating the "two days per month" rule day by day; if the accrual is instead counted in whole months only, the figure is **16 days**. That choice is a point the law leaves unsettled — **OQ-005** — so part of the 16.2 figure rests on it. Either way, the entitlement is a statutory **minimum**: your contract or your employer's regulations can give you more, but not less (Article 29(1)).

      Note also that no accrual runs at all until you have passed six months of service (Article 29(1)(b)); the first six months earn nothing under this clause.

      **2. Once you complete one full year: 30 days**

      Article 29(1)(a) gives **thirty days of full-pay annual leave for each year of service**. So on your work anniversary your entitlement for that first year becomes **30 days** (the calculation tool confirms 30.0 days for 365 days of service). From that point the 30-day figure applies for each further year of service.

      **3. Related points that may matter to you**

      - **Paid leave:** you are entitled to your wage for the annual leave period (Article 29(6)), and rest days falling inside an uninterrupted leave period count as part of it unless your contract is more favourable to you (Article 29(7)).
      - **Timing:** you should take the leave in the year it falls due; the employer sets the dates (in agreement with you) and must notify you at least one month in advance (Article 29(4)). The employer cannot stop you taking leave for more than two years unless you agree to carry it forward or take a cash allowance (Article 29(8)).
      - **Carry-over / cash:** you may carry forward up to half of your annual leave into the next year, or agree with your employer to be paid its equivalent at the wage you earn when the leave falls due (Executive Regulations, Article 19(1)). If your service ends, the untaken balance is payable in cash on your **basic salary** (Article 19(2) of the Regulations; Article 29(9) of the Law).
      - **Leave during probation:** the employer may agree to grant leave from your accrued balance during probation, and you keep the right to be paid for the remainder if you do not pass probation (Article 29(3)).
      - **Part-time:** if you are on a part-time contract, leave is pro-rated to your actual contracted hours, with a floor of five working days a year, and a part-day counts as a full day (Article 29(2); Executive Regulations Article 18).

      Figures above assume full-time work, no leave already taken, and eight complete months of service. If you tell me your exact start date, any leave days already taken, whether you are part-time (and your contracted hours ratio), and your basic wage, I can re-run the calculation and give you the cash value of any untaken balance.

      *This is general information about the statutory rules, not legal advice.*
    citations:
    - labour-law Art 29
    - labour-law Art 67
    - executive-regulations Art 19
    - executive-regulations Art 18
