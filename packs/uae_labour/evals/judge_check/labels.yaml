- id: jc-016
  rubric: bilingual
  question:
    en: |-
      I'm a foreign worker on a full-time contract. I started work on 1 January 2020 and my last day of work was 31 December 2022. My basic wage is AED 7,300 a month and my total wage with allowances is AED 10,000. How much end-of-service gratuity am I owed?
    ar: |-
      أنا عامل أجنبي بعقد دوام كامل. بدأت العمل في 1 يناير 2020 وكان آخر يوم عمل لي 31 ديسمبر 2022. أجري الأساسي 7,300 درهم شهريًا وأجري الإجمالي مع البدلات 10,000 درهم. ما مقدار مكافأة نهاية الخدمة المستحقة لي؟
  answer:
    en:
      status: answered
      text: |-
        Your end-of-service gratuity is AED 15,133.81.

        How it is calculated:
        - Service: 1 January 2020 to 31 December 2022 = 1,096 days (both days counted), with no unpaid absence.
        - Daily basic wage: AED 7,300 × 12 ÷ 365 = AED 240. The gratuity is based on the basic wage only, not the AED 10,000 total with allowances.
        - Gratuity days: 1,096 days at the 21-day rate = about 63.06 days' pay.
        - Gratuity: 63.06 × AED 240 = AED 15,133.81. This is below the statutory cap, so no cap applies.

        This is a statutory calculation based on the facts you gave, not legal advice.
      citations:
      - labour-law Art 51
      - labour-law Art 67
    ar:
      status: answered
      text: |-
        مكافأة نهاية الخدمة المستحقة لك تقريبًا 15,133.81 درهم.

        طريقة الحساب:
        - مدة الخدمة من 1 يناير 2020 إلى 31 ديسمبر 2022، أي 1,096 يومًا.
        - الأجر اليومي الأساسي: 7,300 × 12 ÷ 365 = 240 درهمًا. تُحسب المكافأة على الأجر الأساسي دون البدلات.
        - المدة أقل من خمس سنوات، فتُحسب بواقع 21 يومًا عن كل سنة: 63.0575 يومًا.
        - المكافأة: 63.0575 × 240 = 15,133.81 درهمًا، وهي أقل من سقف المكافأة فلا يُطبَّق الحد الأقصى.

        هذه معلومات قانونية عامة وليست استشارة قانونية.
      citations:
      - labour-law Art 51
      - labour-law Art 67
  sources: []
  criteria:
    same_conclusion:
      rule: |-
        Both answers reach the same outcome: the same status (answered, refused or not found), the same
        yes or no, the same figure, and the same entitlement or obligation. Fail if a person reading only
        one of the answers would come away with a different result than a person reading only the other.
      label: pass
    same_details:
      rule: |-
        Every substantive point in one answer is also in the other with the same value: each period,
        amount, rate, condition, exception and next step it gives. Fail if one answer adds, omits or
        changes such a point. Restating the question, a disclaimer, or a courtesy phrase is not a
        substantive point.
      label: pass
