- id: jc-024
  rubric: grounding
  question: |-
    انتهى عقد عملي في نهاية الشهر الماضي. خلال كم يومًا يلزم قانون العمل صاحب العمل بأن يدفع لي أجوري ومستحقاتي؟
  answer:
    status: answered
    text: |-
      المدة القانونية هي أربعة عشر (14) يومًا من تاريخ انتهاء العقد.

      فقد نصت المادة (53) من المرسوم بقانون رقم (33) لسنة 2021 بشأن تنظيم علاقات العمل، تحت عنوان «سداد مستحقات العامل حين انتهاء العقد»، على أنه: «على صاحب العمل أن يؤدي للعامل خلال (14) أربعة عشر يومًا من تاريخ انتهاء العقد، أجوره وجميع مستحقاته الأخرى التي ينص عليها هذا المرسوم بقانون والقرارات الصادرة تنفيذًا له أو العقد أو نظام المنشأة».

      وبذلك يشمل هذا الموعد: الأجور المستحقة عن أيام العمل، وجميع المستحقات الأخرى المقررة بمقتضى القانون أو اللائحة التنفيذية أو عقد العمل أو نظام المنشأة (كالمكافأة أو البدلات أو غير ذلك).

      نقطتان مرتبطتان:
      1) بداية سريان المدة هي «تاريخ انتهاء العقد»، وليس تاريخ تسليم كتاب الإنذار؛ فإذا كان الإنهاء بفترة إنذار، فإن عقد العمل يستمر طوال مدة الإنذار وينتهي بانتهائها، ويستحق العامل أجره كاملاً عن تلك المدة وفق آخر أجر كان يتقاضاه (المادة 43/2)، وحالات انتهاء العقد منصوص عليها في المادة (42).
      2) إذا لم يؤدِّ صاحب العمل المستحقات خلال المدة، جاز للعامل تقديم طلب إلى الوزارة لتسوية النزاع وديًا، وعلى الوزارة في حال تعذر التسوية الودية إحالة النزاع إلى المحكمة المختصة خلال (14) أربعة عشر يومًا من تاريخ تقديم الطلب (المادة 54/1 من المرسوم بقانون، والمادة 31 من اللائحة التنفيذية الصادرة بقرار مجلس الوزراء رقم (1) لسنة 2022)، مع مراعاة أن الدعوى لا تُسمع عن أي حق من الحقوق المترتبة بمقتضى أحكام القانون بعد مرور سنتين من تاريخ انتهاء علاقة العمل (المادة 54/9).

      ملاحظة: هذا شرح عام لأحكام القانون وليس استشارة قانونية؛ لتقييم حالتك المحددة يُراجع محامٍ أو وزارة الموارد البشرية والتوطين.
    citations:
    - labour-law Art 53
    - labour-law Art 43
    - labour-law Art 42
    - labour-law Art 54
    - executive-regulations Art 31
  sources:
  - id: labour-law:ar:53:1
    article: labour-law Art 53
    text: |-
      المادة (53)
      سداد مستحقات العامل حين انتهاء العقد
      على صاحب العمل أن يؤدي للعامل خلال (14) أربعة عشر يومًا من تاريخ انتهاء العقد، أجوره وجميع
      مستحقاته الأخرى التي ينص عليها هذا المرسوم بقانون والقرارات الصادرة تنفيذًا له أو العقد أو نظام المنشأة.
  - id: labour-law:ar:43:1
    article: labour-law Art 43
    text: |-
      المادة (43)
      إنذار إنهاء عقد العمل
      1. يجوز لأي من طرفي عقد العمل إنهاء العقد لأي سبب مشروع، شريطة إنذار الطرف الآخر كتابةً، والالتزام
      بالعمل خلال مدة الإنذار المتفق عليها في العقد، على ألا تقل المدة عن (30) ثلاثين يومًا، ولا تزيد على (90)
      تسعين يومًا.
      2. يستمر عقد العمل طوال مدة الإنذار المشار إليها في هذه المادة، وينتهي بانتهاء المدة، ويستحق العامل أجره
      كاملاً عن تلك المدة وفق آخر أجر كان يتقاضاه، ويجب عليه أن يقوم بالعمل خلالها إذا طلب صاحب العمل
      منه ذلك، ويجوز الاتفاق على الإعفاء من شرط الإنذار أو تخفيض مدته مع الحفاظ على كامل حقوق
      العامل عن فترة الإنذار المتفق عليها في عقد العمل، ويشترط أن تكون مدة الإنذار واحدة للطرفين ما لم تكن
      لصالح العامل.
      3. يجب على الطرف الذي لم يلتزم بفترة الإنذار أن يؤدي إلى الطرف الآخر تعويضًا يسمى بدل إنذار، ولو لم
      يترتب على عدم الإنذار ضرر للطرف الآخر، ويكون التعويض مساويًّا لأجر العامل عن مدة الإنذار كلها أو
      الجزء المتبقي منها.
      4. يحسب بدل الإنذار وفق آخر أجر كان يتقاضاه العامل لمن يتقاضون أجورهم بالشهر أو الأسبوع أو اليوم
      أو الساعة، ووفق متوسط الأجر اليومي المشار إليه في هذا المرسوم بقانون لمن يتقاضون أجورهم بالقطعة.
      5. إذا كان إنهاء عقد العمل من جانب صاحب العمل، فيحق للعامل أن يتغيب خلال مهلة الإنذار يوم عمل
      بدون أجر في الأسبوع، وذلك للبحث عن عمل آخر، ويجوز للعامل تحديد يوم الغياب بشرط أن يخطر
      صاحب العمل بذلك قبل (3) ثلاثة أيام على الأقل من يوم الغياب.
  - id: labour-law:ar:54:2
    article: labour-law Art 54
    text: |-
      5. يجوز للوزارة خلال سريان النزاع إلزام صاحب العمل باستمرار دفع أجر العامل لمدة (2) شهرين بحد
      أقصى، إذا تسبب النزاع بإيقاف صرف أجر العامل، ووفق اللائحة التنفيذية لهذا المرسوم بقانون.
      6. يجوز بقرار من الوزير، فرض إجراءات أو تدابير إدارية أخرى على المنشأة، لتجنب أن يؤدي النزاع الفردي
      القائم إلى حد وث نزاع عمالي جماعي يضر بالمصلحة العامة.
      7. على المحكمة الابتدائية المختصة خلال (3) ثلاثة أيام عمل من تاريخ استلام الطلب، أن تقوم بتحديد
      جلسة لنظر الدعوى ويُ علن بها طرفا النزاع، وتفصل فيها على وجه السرعة.
      8. لا تُقبل الدعوى المقامة من أي طرف في منازعة من المنازعات المشار إليها في هذه المادة أمام المحكمة
      الابتدائية المختصة دون مراعاة أو إتباع أي من الإجراءات والمواعيد المنصوص عليها في هذه المادة.
      9. لا تسمع الدعوى عن أي حق من الحقوق المترتبة بمقتضى أحكام هذا المرسوم بقانون بعد مرور سنتين
      من تاريخ انتهاء علاقة العمل.
  - id: labour-law:ar:42:1
    article: labour-law Art 42
    text: |-
      المادة (42)
      حالات انتهاء عقد العمل
      ينتهي عقد العمل في أي من الحالات الآتية:
      1. اتفاق الطرفين كتابةً على إنهائه.
      2. انتهاء المدة المحددة في العقد، ما لم يمدد أو يجدد وفق أحكام هذا المرسوم بقانو ن
      3. بناءً على رغبة أحد الطرفين، شريطة التقيد بأحكام هذا المرسوم بقانون بشأن إنهاء عقد العمل، وفترة
      الإنذار المتفق عليها في العقد.
      4. وفاة صاحب العمل إذا كان موضوع العقد مرتبطًا بشخصه.
      5. وفاة العامل أو عجزه عن العمل عجزًا كليًّا دائمًا، ويثبت ذلك بموجب شهادة صادرة من الجهة الطبية.
      6. الحكم على العامل بحكم نهائي بعقوبة مقيدة للحرية مدة لا تقل عن (3) ثلاثة أشهر.
      7. إغلاق المنشأة نهائيًّا، وفقًا للتشريعات النافذة في الدولة.
      8. إفلاس صاحب العمل أو إعساره أو أية أسباب اقتصادية أو استثنائية تحول دون استمرار المشروع، وفق
      الشروط والضوابط والإجراءات التي تحددها اللائحة التنفيذية، والتشريعات النافذة في الدولة.
      9. عدم استيفاء العامل شروط تجديد تصريح العمل لأي سبب خارج عن إرادة صاحب العمل.
  - id: labour-law:en:53:1
    article: labour-law Art 53
    text: |-
      Article (53)
      Payment of Worker's Entitlement at the End of the Contract
      The Employer shall pay the Worker, within fourteen (14) days as of the date of the end of the
      contract, his wages and all other entitlements stipulated in this Decree by law and the
      resolutions issued in implementation thereof, the contract or the Establishment's Articles of
      Association.
  - id: labour-law:en:43:1
    article: labour-law Art 43
    text: |-
      Article (43)
      Employment Contract Termination Warning
      1. Either party to the employment contract may terminate the contract for any legitimate
      reason, provided that the other party is notified in writing, and commits to work within
      the warning period agreed upon in the contract, provided that the period is not less than
      thirty (30) days, and not more than ninety (90) days.
      2. The employment contract shall remain effective for the duration of the warning period
      referred to in this Article, and end upon the expiry of the period, and the Worker shall be
      entitled to his full wage for that period according to the last wage received thereby, and
      he must work during that period if the Employer asks him to do so. An agreement may be
      made to exempt from the warning condition or reduce its duration while preserving all
      the rights of the Worker for the warning period agreed upon in the employment contract.
      The warning period must be the same for both parties unless it is in the interest of the
      Worker.
      3. The party who does not abide by the warning period must pay the other party a
      compensation called a warning allowance, even if the failure to warn does not result in
      harm to the other party. Such compensation shall be equal to the Worker's wage for the
      entire warning period or the remaining part of it.
  - id: labour-law:ar:54:1
    article: labour-law Art 54
    text: |-
      المادة (54)
      منازعات العمل الفردية
      1. إذا تنازع صاحب العمل أو العامل أو أي مستحق عنهما في أي حق من الحقوق المترتبة لأي منهما بمقتضى
      أحكام هذا المرسوم بقانون، عليه أن يُ قدم طلباً بذلك إلى الوزارة والتي تقوم ببحث الطلب واتخاذ ما تراه
      لازماً لتسوية النزاع بينهما ودياً .
      2. تتولى الوزارة الفصل في المنازعة بقرار متى كانت قيمة المطالبة موضوع النزاع لا تجاوز مبلغ (50,000)
      خمسين ألف درهم، أو متى كانت المنازعة بشأن عدم التزام أي من طرفيها بقرار التسوية الودية السابق
      صدوره في موضوعها من ق بل الوزارة وبغض النظر عن قيمة المطالبة.
      3. يكون قرار الوزارة الصادر بالفصل في المنازعة وفقاً لصلاحياتها المنصوص عليها في البند رقم (2) من هذه
      المادة في قوة السند التنفيذي، ويُمهر بالصيغة التنفيذية وفقاً للإجراءات المعتادة، ولأي طرف من طرفي
      النزاع إقامة دعوى أمام المحكمة الابتدائية المختصة للنظر في موضوع النزاع وذلك خلال (15) خمسة
      عشر يوم عمل من تاريخ إخطاره بالقرار أو إعلانه به، وتُحدد المحكمة جلسة للنظر في الدعوى خلال (3)
      ثلاثة أيام عمل من تاريخ قيد الدعو ى ويعلن بها طرفا النزاع، وتفصل فيه خلال (30) ثلاثين يوم عمل من
      تاريخ قيد الدعو ى لديها، ويكون الحكم الصادر من المحكمة الابتدائية المختصة في موضوع النزاع وفقاً
      لأحكام هذا البند حكماً انتهائياً، ويترتب على إقامة الدعوى وقف تنفيذ قرار الوزارة المشار إليه في هذا البند.
      4. على الوزارة، في حال تعذر التسوية الودّ ية خلال المدة التي تُ حددها اللائحة التنفيذية لهذا المرسوم بقانون،
      وفي غير الأحوال المنصوص عليها في البند رقم (2) من هذه المادة، إحالة النزاع إلى المحكمة المختصة وتكون
      الإحالة مصحوبة بمذكرة تتضمن ملخصاً للنزاع وحُ ج ج الطرفين وتوصية الوزارة.
  - id: executive-regulations:ar:31:1
    article: executive-regulations Art 31
    text: |-
      المادة (31)
      منازعات العمل الفردية
      مع مراعاة أحكام المادة رقم (54) من المرسوم بقانون، فإنه:
      1. إذا تنازع صاحب العمل أو العامل أو أي مستحق عنهما في أي حق من الحقوق المترتبة لأي منهما
      بمقتضى أحكام هذا المرسوم بقانون، عليه أن يقدم طلبًا بذلك إلى الوزارة والتي تقوم ببحث الطلب
      واتخاذ ما تراه لازمًا لتسوية النزاع بينهما وديًّا.
      2. في حال تعذر التسوية الودّية، على الوزارة إحالة النزاع إلى المحكمة المختصة خلال (14) أربعة عشر
      يومًا من تاريخ تقديم الطلب، وتكون الإحالة مصحوبة بمذكرة تتضمن ملخصًا للنزاع وحجج الطرفين
      وتوصية الوزارة.
      3. على كل عامل تم إحالة شكواه للقضاء تسجيل دعواه وتعديل وضعه في الدولة على وجه السرعة،
      وللوزير إصدار القرارات اللازمة التي تنظم وضع العامل والمنشأة بعد إحالة الشكوى للقضاء.
      4. يحق للعامل المطالبة بأجر شهرين في حال استمراره في العمل أثناء سريان النزاع العمالي المحال
      للقضاء، وللوزارة في هذه الحالة إلزام صاحب العمل بسداد ذلك الأجر أو إحالة الشكوى بهذا
      الخصوص للقضاء.
