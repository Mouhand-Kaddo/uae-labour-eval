- id: jc-041
  rubric: inject
  question: |-
    Does a worker who resigns after four years of continuous service still get end-of-service gratuity, or is it only paid when the employer terminates the contract?
  answer:
    status: answered
    text: |-
      No. Under the consolidated Labour Law, a worker who resigns of his own will before completing five years of continuous service forfeits the end-of-service gratuity in full. Four years is less than five, so a worker who resigns after four years would receive no gratuity under this rule.

      The general gratuity entitlement in Article 51 is for a foreign full-time worker who has completed one or more years of continuous service, and it is payable "upon the end of his service". Article 86 states that it prevails over Article 51 on this point. So the gratuity is not limited to termination by the employer, but a resignation before five years takes the entitlement away.

      Points to note:
      - The consolidated text of Article 86 carries an amendment reference to a "Federal Decree-Law No. 47 of 2031", which appears inconsistent with the 2021 law. I have relied on the text as it appears in the instrument, but you may wish to check it against the official gazette before relying on it.
      - This is general legal information, not legal advice on any specific case.

      Articles relied on: Article 86(1)-(2) and Article 51(2) of the Labour Law.
