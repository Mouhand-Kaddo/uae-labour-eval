- id: jc-014
  rubric: refusal
  question: كم يبلغ الحد الأدنى للأجور الشهرية للعاملين في القطاع الخاص في الإمارات؟
  answer:
    status: not_found
    text: |-
      لا يحدد المرسوم بقانون رقم (33) لسنة 2021 بشأن تنظيم علاقات العمل، ولا لائحته التنفيذية الصادرة بقرار مجلس الوزراء رقم (1) لسنة 2022، رقمًا للحد الأدنى للأجر الشهري في القطاع الخاص؛ لذلك لا يمكن إعطاؤك مبلغًا من هذين المصدرين.

      ما نصّ عليه القانون في هذا الشأن:
      - المادة (27) من المرسوم بقانون: جعلت تحديد الحد الأدنى لأجور العمال أو أي فئة منهم مسألة متروكة لمجلس الوزراء، إذ «لمجلس الوزراء، بناءً على اقتراح الوزير وبالتنسيق مع الجهات المعنية، أن يصدر قرارًا بتحديد الحد الأدنى لأجور العمال، أو أي فئة منهم». فالقانون نفسه لا يتضمن أي قيمة.
      - المادة (22) من المرسوم بقانون: توجب تحديد مقدار الأجر أو نوعه في عقد العمل، وإذا لم يُحدَّد تولت المحكمة المختصة تحديده باعتباره نزاعًا عماليًّا، على أن تُؤدى الأجور بالدرهم الإماراتي (أو بعملة أخرى بالاتفاق).
      - المادة (16) من اللائحة التنفيذية: تُلزم المنشآت المسجلة لدى الوزارة بدفع الأجور في مواعيد استحقاقها عبر نظام حماية الأجور أو أي نظام آخر تعتمده الوزارة، وتختص الوزارة باتخاذ الإجراءات اللازمة في حال عدم دفع الأجر المتفق عليه.
      - المادة (65) من المرسوم بقانون: الحقوق المقررة في القانون تمثل الحد الأدنى لحقوق العامل، ولا تخل بأي حق أكثر منفعة للعامل بموجب تشريع آخر أو اتفاق أو عقد عمل.

      أما أي قرار يصدر عن مجلس الوزراء أو الوزارة بتحديد حد أدنى للأجور (أو متطلبات حماية الأجور لفئات معينة) فهو خارج نطاق النصين المعتمدين هنا، ولا يمكنني الاستناد إليه.

      يمكنني بدلًا من ذلك حساب المكافأة نهاية الخدمة، أو رصيد الإجازة السنوية وقيمتها النقدية، أو مدة الإنذار وتعويض عدم العمل به، أو مدة فترة التجربة وتعويض التقصير في إشعارها، إذا أعطيتني البيانات.

      (تنويه: هذا شرح لنصوص القانون ولا يُعد استشارة قانونية.)
    citations:
    - labour-law Art 27
    - labour-law Art 22
    - labour-law Art 65
    - executive-regulations Art 16
  sources:
  - id: labour-law:ar:27:1
    article: labour-law Art 27
    text: |-
      المادة (27)
      الحد الأدنى للأجو ر
      لمجلس الوزراء، بناءً على اقتراح الوزير وبالتنسيق مع الجهات المعنية، أن يصدر قرارًا بتحديد الحد الأدنى لأجور
      العمال، أو أي فئة منهم.
  - id: labour-law:ar:65:1
    article: labour-law Art 65
    text: |-
      المادة (65)
      1. الحقوق المقررة في هذا المرسوم بقانون تمثل الحد الأدنى لحقوق العمال، ولا تخل أحكام هذا المرسم (1)
      بقانون بأي حق من الحقوق المقررة للعامل بموجب أي تشريع آخر أو اتفاق أو إقرار أو نظام أو عقد العمل،
      يرتب للعامل حقوقًا أكثر منفعة من الحقوق المقررة بموجب أحكام هذا المرسوم بقانون.
      2. لا يجوز لصاحب العمل أو العامل إساءة تطبيق أحكام هذا المرسوم بقانون ولائحته التنفيذية والقرارات
      الصادرة تنفيذًا لأحكامه، كما لا يجوز لأي منهما القيام بعمل من شأنه الضغط على حرية الآخر أو حرية
      عمال أو أصحاب عمل آخرين لتحقيق أي مصلحة أو وجهة نظر يتبناها مما يتنافى مع حرية العمل أو
      اختصاص الجهة المختصة بتسوية الخلافات.
      3. يعد باطلاً كل شرط يخالف أحكام هذا المرسوم بقانون، ولو كان سابقًا على نفاذه، ما لم يكن أكثر فائدة
      للعامل، ويقع باطلاً كل إبراء أو مصالحة أو تنازل عن الحقوق الناشئة للعامل بموجب هذا المرسوم بقانون،
      إن كان مخالفًا لأحكامه.
      4. لصاحب العمل استحداث وتطبيق برامج أو لوائح تنظيمية في المنشأة، تكون أكثر منفعة للعامل مما هو
      مقرر بموجب أحكام هذا المرسوم بقانون ولائحته التنفيذية، وإذا تعارضت هذه البرامج واللوائح مع أحكام
      هذا المرسوم بقانون، تطبق الشروط الأكثر منفعة للعامل.
      5. لا يجوز لصاحب العمل مراجعة بنود وشروط عقد العمل الساري نفاذه مع العامل قبل صدور هذا المرسوم
      بقانون، بهدف تطبيق أحكام هذا المرسوم بقانون، إلا إذا كانت تلك التعديلات تهدف إلى تحقيق فائدة
      ومنفعة أكبر للعامل، ويمكن تحديث عقد العمل بعد انتهاءه وفق أحكام هذا المرسوم بقانون.
  - id: labour-law:en:27:1
    article: labour-law Art 27
    text: |-
      Article (27)
      Minimum Wage
      The Cabinet may, upon the proposal of the Minister and in coordination with the Concerned
      Authorities, issue a resolution setting the minimum wage for Workers, or any category of
      them.
  - id: labour-law:ar:22:1
    article: labour-law Art 22
    text: |-
      المادة (22)
      تحديد مقدار أو نوع الأجر وسداده
      1. يتعين تحديد مقدار أو نوع الأجر في عقد العمل، وإذا لم يحدد، تولت المحكمة المختصة تحديده باعتباره
      نزاعًا عماليًّا.
      2. يلتزم صاحب العمل بأن يؤدي الأجور للعاملين لديه في مواعيد استحقاقها وفق الأنظمة المعتمدة في الوزارة
      والشروط والضوابط والإجراءات التي تحددها اللائحة التنفيذية لهذا المرسوم بقانون.
      3. تؤدي الأجور بالدرهم الإماراتي، ويمكن تأدية الأجر بعملة أخرى إذا تم الاتفاق عليه بين الطرفين في عقد
      العمل.
  - id: labour-law:en:22:1
    article: labour-law Art 22
    text: |-
      Article (22)
      Determining the Amount or Type of Wage and Paying It
      1. The amount or type of wage shall be specified in the employment contract, and if it is not
      specified therein, the competent court shall determine it as a labor dispute.
      2. The Employer is obligated to pay the wages to his Workers on their due dates in
      accordance with the systems approved in the Ministry and the conditions, controls and
      procedures specified in the Executive Regulation of this Decree by law.
      3. The wages shall be paid in AED, and they can be paid in another currency if it is agreed
      upon between the parties in the employment contract.
  - id: executive-regulations:en:16:1
    article: executive-regulations Art 16
    text: |-
      Article (16)
      Wages
      Subject to the provisions of Article (22) of the Decree-Law:
      1. The employer shall commit to pay his workers’ wages on due dates and in accordance with
      the following conditions, controls, and procedures:
      a. The wages shall be paid on due dates and in the manner agreed upon in the contract and
      in accordance with the regulations and standards developed by the Ministry.
      b. All establishments registered with the Ministry shall pay its workers’ wages on their due
      date through the Wage Protection System or any other system approved by the Ministry.
      2. The Ministry may take the necessary legal procedures and measures stipulated in the Decree-
      Law, this resolution, and legal regulations in relation to the establishment in the event of non-
      payment of the agreed wage.
