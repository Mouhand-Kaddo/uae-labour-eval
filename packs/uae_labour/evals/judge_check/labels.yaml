    text: |-
      لم يتضمن قانون العمل ولا لائحته التنفيذية، في النصوص المتاحة لي، رقماً محدداً للحد الأدنى للأجور الشهرية للعاملين في القطاع الخاص. فالمادة (27) من قانون العمل تنص على أن لمجلس الوزراء، بناءً على اقتراح الوزير وبالتنسيق مع الجهات المعنية، أن يصدر قراراً بتحديد الحد الأدنى لأجور العمال أو لأي فئة منهم. وبالتالي فإن أي مبلغ يُعتمد يكون بقرار من مجلس الوزراء، ولم أجد هذا القرار ضمن النصوص المتاحة لي. وتنص المادة (22) على أن مقدار الأجر ونوعه يحددان في عقد العمل.

      هذه معلومات عامة وليست نصيحة قانونية.
