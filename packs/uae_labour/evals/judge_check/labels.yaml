- id: jc-026
  rubric: grounding
  question: |-
    How many days of absence without a valid reason allow an employer to dismiss a worker without notice under the UAE Labour Law?
  answer:
    status: answered
    text: |-
      Under the UAE Labour Law, there is no specific number of days of absence that automatically grants an employer the right to dismiss a worker without notice.

      However, the law does establish a specific procedure regarding "unlawful absence":

      *   **Reporting Requirement:** An employer is required to notify the Ministry of Human Resources and Emiratisation if a worker is absent from work for more than **seven (7) consecutive days** without the employer knowing the worker's whereabouts or having a means of communication with them (Article 28 of the Executive Regulations).
      *   **Dismissal:** The Labour Law does not explicitly list "absence" as a standalone ground for dismissal without notice under Article 44. Dismissal without notice is generally reserved for the specific, serious infractions listed in Article 44, such as impersonation, causing grave material loss, or violating safety instructions.

      If an employer intends to dismiss a worker for failing to perform their duties (which could include persistent, unjustified absence), they must follow the procedures outlined in Article 44(4), which requires a written investigation and prior warnings.

      *Disclaimer: This information is for educational purposes and does not constitute legal advice.*
    citations:
    - labour-law Art 44
    - executive-regulations Art 28
  sources:
  - id: labour-law:en:44:1
    article: labour-law Art 44
    text: |-
      Article (44)
      Cases of Dismissal of Worker Without Warning
      The Employer may dismiss the Worker without warning, after conducting a written
      investigation with him, and the decision to dismiss shall be in writing and reasoned, and the
      Employer or his representative shall hand it to the Worker in any of the following cases:
      1. If it is proven that the Worker impersonates another person or has submitted false
      certificates or documents.
      2. If the Worker makes a mistake that results in a grave material loss to the Employer, or if
      the Worker deliberately harms the property of the Employer and acknowledges the same,
      provided that the latter shall inform the Ministry of the incident within seven (7) business
      days as of the time of his knowledge of the occurrence of the incident.
      3. If the Worker violates the instructions of the Establishment's internal system related to the
      safety of work and Workers or the workplace, provided that they are written and displayed
      in a visible place, and that the Worker has been informed thereof.
      4. If the Worker fails to perform his basic duties according to the employment contract and
      continues to breach them despite conducting a written investigation with him for this
      reason and warning him twice of dismissal in case of repetition.
  - id: executive-regulations:en:28:1
    article: executive-regulations Art 28
    text: |-
      Article (28)
      Controls for Reporting the Worker’s Absence from Work
      Subject to the provisions of Article (50) of the Decree-Law:
      1. The employer shall notify the Ministry of the worker’s absence from work in accordance with
      the following controls and procedures:
      a. The absence from work shall be for more than (7) consecutive days, without the
      employer’s knowledge of the worker’s whereabouts or the means of communication with
      him.
      b. The absence from work form shall be completed in accordance with the procedures
      determined by the Minister.
      2. In the event the worker is absent from work, for an unjustified reason, before the expiry of the
      contract’s term, he shall not be granted another work permit for a year starting from the date
      of absence of work, with the following exceptions:
      a. The worker who is sponsored by his parents.
      b. The worker who applies for a new work permit for the same establishment.
      c. The worker who has skill, professional or knowledge levels needed by the State.
      d. Holders of the golden residency.
      e. Any professional categories based on the needs of the labour market in the State
      stipulated in a resolution issued by the Minister under the manpower classification
      approved by the Cabinet.
      3. The Minister may issue a resolution determining the mechanisms of reporting the absence
      from work in accordance with the applicable digital system at the Ministry.
