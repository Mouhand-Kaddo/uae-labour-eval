- id: jc-043
  rubric: grounding
  question: |-
    Under the UAE Labour Law, how much maternity leave is a female worker entitled to, how much of it is paid, and can she take more time off afterwards if she or her baby is ill?
  answer:
    status: answered
    text: |-
      ## Maternity leave under the UAE Labour Law (Federal Decree-Law No. 33 of 2021, consolidated)

      **1. Length and pay**
      A female worker is entitled to **60 days of maternity leave**:
      - **First 45 days — full pay**
      - **Following 15 days — half pay**

      (Labour Law, Article 30(1)(a)–(b))

      The employer must grant the leave whenever she requests it, starting from the last day of the month immediately preceding the month in which she is expected to give birth, proven by a certificate from the Medical Authority (Article 30(5)). The entitlement arises if she gives birth at **six months or more of pregnancy**, whether the foetus is born dead or is born alive and then dies (Article 30(3)).

      **2. Extra time off if she or the baby is ill**
      Yes — two separate routes:

      - **Illness caused by pregnancy or childbirth ( hers or the child's):** after using her maternity leave she may be **absent without pay for up to 45 consecutive or intermittent days**, where the illness prevents her returning to work and is proven by a medical certificate from the Medical Authority. Important consequence: this period is **not counted as service** for end-of-service gratuity or for retirement-pension contribution purposes (Article 30(2)).
      - **Baby born sick or disabled requiring a constant companion:** on a medical report from the Medical Authority she gets **30 days with full pay** immediately after the maternity leave, **extendable by a further 30 days without pay** (Article 30(4)).

      For illness **not** connected to pregnancy or childbirth, the ordinary sick-leave rules apply instead: up to 90 consecutive or intermittent days per year — first 15 days full pay, next 30 days half pay, the remainder unpaid (no paid sick leave during probation) (Labour Law, Article 31).

      **3. Other related protections and entitlements**
      - Taking maternity leave or the above absence **does not prejudice her right to other leaves** (Article 30(6)) — e.g. the paid **parental leave of 5 working days** to be taken continuously or intermittently within six months of the birth (Article 32(1)(b)), which the Executive Regulations allow to be combined with mourning, annual and unpaid leave (Executive Regulations, Article 21(4)–(5)).
      - **She cannot be dismissed, and no notice may be given to her, because of pregnancy, because she took maternity leave, or because she is absent under this article** (Article 30(8)).
      - If she **works for another employer during the authorised leave**, her original employer may withhold her wage for the leave period or recover what he paid her (Article 30(7)).
      - On returning to work, and for a period not exceeding **six months from the date of birth**, she is entitled to one or two daily rest periods for breastfeeding, totalling **no more than one hour** (Article 30(9)).

      **Summary of the paid/unpaid split:** 45 days full pay + 15 days half pay (the 60-day maternity leave); then, if medically certified, up to 45 unpaid days for a pregnancy/childbirth-related illness; and, for a sick or disabled child needing constant company, 30 days full pay plus an optional 30 unpaid days.

      *This is general information about the statutory provisions based on the facts you asked about, not legal advice.*
    citations:
    - labour-law Art 30
    - labour-law Art 31
    - labour-law Art 32
    - executive-regulations Art 21
  sources:
  - id: labour-law:en:30:1
    article: labour-law Art 30
    text: |-
      Article (30)
      Maternity Leave
      1. The female Worker shall be entitled to maternity leave of (60) sixty days, according to the
      following:
      a. The first forty-five (45) days with full pay.
      b. The following fifteen (15) days with half pay.
      2. The female Worker may, after using her maternity leave, be absent work without pay for
      a period not exceeding forty-five (45) consecutive or intermittent days, if such absence is
      due to an illness suffered by her or her child as a result of pregnancy or childbirth and that
      does not enable her to return to her work. Said illness shall be proven by a medical
      certificate issued by the Medical Authority, and this period shall not be included in the
      period of service for which the female Worker is entitled to the end of service gratuity or
      the period of contribution to the retirement system in accordance with the legislation in
      force in this regard.
      3. The female Worker is entitled to the maternity leave stated in Clause (1) of this Article, if
      she gives birth after six (6) months or more of pregnancy, whether the foetus is born dead
      or born alive then died.
  - id: labour-law:en:30:2
    article: labour-law Art 30
    text: |-
      4. The female Worker, in the event that she gives birth to a sick or disabled child whose
      health condition requires a constant companion according to a medical report issued by
      the Medical Authority, is entitled to a leave of thirty (30) days with full pay starting after
      the end of the maternity leave period, and she has the right to extend the leave for a period
      of thirty (30) days without pay.
      5. The Employer must grant the female Worker maternity leave whenever she requests it at
      any time, starting as of the last day of the month immediately preceding the month in
      which she is expected to give birth, and this shall be proven by a certificate from the
      Medical Authority.
      6. Obtaining the maternity leave or the absence referred to in this Article shall not prejudice
      her right to obtain other leaves.
      7. If the female Worker works for another Employer during the period of her leave
      authorized in this article, the original Employer may deprive her of her wage for the period
      of the leave or recover what he paid to her.
      8. It is not permissible to terminate the service of a female Worker or to give her notice
      because of pregnancy, or because she has obtained maternity leave, or because she is
      absent from work in accordance with the provisions of this Article.
  - id: labour-law:en:30:3
    article: labour-law Art 30
    text: |-
      9. After returning from maternity leave and for a period not exceeding six (6) months as of
      the date of giving birth, the female Worker is entitled to one or two rest periods per day to
      breastfeed her child, provided that the period of both periods shall not exceed one hour.
  - id: labour-law:en:31:1
    article: labour-law Art 31
    text: |-
      Article (31)
      Sick Leave
      1. If the Worker suffers an illness that is not caused by a work injury, he must inform the
      Employer or his representative of his illness, within a period not exceeding three (3)
      business days and submit a medical report on his condition issued by the Medical
      Authority.
      2. The Worker is not entitled to a paid sick leave during the Probation Period, but the
      Employer may grant him a sick leave without pay, based on a medical report issued by the
      Medical Authority that includes the necessity of granting the leave.
      3. After the Probation Period, the Worker may receive a sick leave of no more than (90)
      ninety consecutive or intermittent days per year, provided that it shall be calculated as
      follows:
      a. The first fifteen (15) days with full pay.
      b. The following thirty (30) days with half pay.
      c. The following period shall be unpaid.
      4. The sick leave shall not be paid if the illness is a result from the Worker's misconduct, in
      accordance with the cases specified in the Executive Regulation of this Decree by law.
      5. The Employer may terminate the Worker's service after completing his sick leave referred
      to in this article, if he is unable to return to work, provided that the Worker receives all his
      financial dues in accordance with the provisions of this Decree by law and its Executive
      Regulation.
  - id: labour-law:en:32:1
    article: labour-law Art 32
    text: |-
      Article (32)
      Various holidays
      1. The Worker is entitled to a paid leave in the following cases:
      a. A mourning leave of five (5) days, in the event of the death of the spouse; and Three
      (3) days in the event of the death of the mother, father, son, brother, sister, grandson,
      grandfather or grandmother, starting as of the date of death.
      b. Parental leave for a period of (5) five working days, for the Worker (whether the father
      or the mother) who has a child, to care for his child, to be enjoyed, continuously or
      intermittently, within a period of six (6) months as of the date of the child's birth.
      c. Any other leaves determined by the Cabinet.
      2. The Worker may be granted a study leave for a period of ten (10) business days per year,
      for the Worker who is enrolled - by affiliation or regularly - in one of the educational
      institutions approved in the State, in order to perform the tests, provided that the period
      of service with the Employer is not less than two years.
      3. The national Worker is entitled to a full-time leave to perform the national and reserve
      service with pay, in accordance with the legislation in force in the State.
      4. In order to obtain the leaves referred to in this Article, a proof of the same must be
      provided by the Concerned Authorities.
      5. The Executive Regulation shall determine the provisions for granting and organizing the
      leaves referred to in this Article.
  - id: executive-regulations:en:21:1
    article: executive-regulations Art 21
    text: |-
      Article (21)
      Miscellaneous Leaves
      Subject to the provisions of Article (32) of the Decree-Law:
      1. The worker may be granted a study leave to take tests, provided that he has obtained an
      academic acceptance from on the accredited institutions or university faculties in the State,
      indicating the type of studies, major and duration of the studies. The establishment may
      request a proof of the dates on which the tests were taken.
      2. The national worker shall be entitled to a full-time leave to perform the national and reserve
      service, pursuant to the laws and regulations applicable in the State.
      3. The worker shall be entitled to a mourning leave starting from the passing date provided that
      he submits what proves the death upon his return to work.
      4. The worker shall be entitled to a parental leave as stipulated in the Decree-Law provided that
      he submits what proves the birth of his child.
      5. It is permissible to combine the mourning, parental, annual, and unpaid leaves.
