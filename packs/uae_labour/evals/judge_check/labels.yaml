    article: labour-law Art 43
    text: |-
      المادة (43)
      إنذار إنهاء عقد العمل
      1. يجوز لأي من طرفي عقد العمل إنهاء العقد لأي سبب مشروع، شريطة إنذار الطرف الآخر كتابةً، والالتزام
      بالعمل خلال مدة الإنذار المتفق عليها في العقد، على ألا تقل المدة عن (30) ثلاثين يومًا، ولا تزيد على (90)
      تسعين يومًا.
      2. يستمر عقد العمل طوال مدة الإنذار المشار إليها في هذه المادة، وينتهي بانتهاء المدة، ويستحق العامل أجره
      كاملاً عن تلك المدة وفق آخر أجر كان يتقاضاه، ويجب عليه أن يقوم بالعمل خلالها إذا طلب صاحب العمل
      منه ذلك، ويجوز الاتفاق على الإعفاء من شرط الإنذار أو تخفيض مدته مع الحفاظ على كامل حقوق
      العامل عن فترة الإنذار المتفق عليها في عقد العمل، ويشترط أن تكون مدة الإنذار واحدة للطرفين ما لم تكن
      لصالح العامل.
      3. يجب على الطرف الذي لم يلتزم بفترة الإنذار أن يؤدي إلى الطرف الآخر تعويضًا يسمى بدل إنذار، ولو لم
      يترتب على عدم الإنذار ضرر للطرف الآخر، ويكون التعويض مساويًّا لأجر العامل عن مدة الإنذار كلها أو
      الجزء المتبقي منها.
      4. يحسب بدل الإنذار وفق آخر أجر كان يتقاضاه العامل لمن يتقاضون أجورهم بالشهر أو الأسبوع أو اليوم
      أو الساعة، ووفق متوسط الأجر اليومي المشار إليه في هذا المرسوم بقانون لمن يتقاضون أجورهم بالقطعة.
      5. إذا كان إنهاء عقد العمل من جانب صاحب العمل، فيحق للعامل أن يتغيب خلال مهلة الإنذار يوم عمل
      بدون أجر في الأسبوع، وذلك للبحث عن عمل آخر، ويجوز للعامل تحديد يوم الغياب بشرط أن يخطر
      صاحب العمل بذلك قبل (3) ثلاثة أيام على الأقل من يوم الغياب.
