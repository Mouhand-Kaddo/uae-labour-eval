- id: jc-018
  rubric: grounding
  question: |-
    أعمل في شركة خاصة في أبوظبي وقد أنهيت فترة التجربة. كم يومًا من الإجازة المرضية يحق لي في السنة وفق قانون العمل، وكم منها مدفوع الأجر؟
  answer:
    status: answered
    text: |-
      وفقاً للمادة (31) من قانون العمل الإماراتي (المرسوم بقانون اتحادي رقم 33 لسنة 2021)، يحق للعامل بعد انتهاء فترة التجربة الحصول على إجازة مرضية لا تزيد مدتها على (90) تسعين يوماً متصلة أو متقطعة عن كل سنة، وتُحسب أجورها على النحو التالي:

      1. **أول 15 يوماً:** بأجر كامل.
      2. **الـ 30 يوماً التالية:** بنصف أجر.
      3. **المدة المتبقية (45 يوماً):** بدون أجر.

      **ملاحظات هامة:**
      *   يجب عليك إبلاغ صاحب العمل أو من يمثله عن مرضك خلال مدة لا تزيد على (3) ثلاثة أيام عمل.
      *   يجب تقديم تقرير طبي عن حالتك صادر عن الجهة الطبية المعتمدة.
      *   لا يستحق العامل أجراً عن الإجازة المرضية إذا كان المرض ناشئاً عن سوء سلوك العامل.

      *تنبيه: هذه المعلومات هي توضيح للنصوص القانونية وليست استشارة قانونية.*
    citations:
    - labour-law Art 31
  sources:
  - id: labour-law:ar:31:1
    article: labour-law Art 31
    text: |-
      المادة (31)
      الإجازة المرضية
      1. على العامل إذا أصيب بمرض غير ناشئ عن إصابة عمل، أن يبلغ صاحب العمل أو من يمثله، عن مرضه،
      وذلك خلال مدة لا تزيد على (3) ثلاثة أيام عمل، وأن يقدم تقريرًا طبيًّا عن حالته صادرًا عن الجهة الطبية.
      2. لا يستحق العامل إجازة مرضية مدفوعة الأجر خلال فترة التجربة، ومع ذلك يجوز لصاحب العمل منحه
      إجازة مرضية بدون أجر، بناءً على تقرير طبي صادر عن الجهة الطبية يتضمن ضرورة منح الإجازة.
      3. للعامل بعد انتهاء فترة التجربة، إجازة مرضية لا تزيد مدتها على (90) تسعين يومًا متصلة أو متقطعة عن
      كل سنة، على أن تحسب على النحو الآتي:
      أ. (15) خمسة عشر يومًا الأولى بأجر كامل.
      ب. (30) ثلاثين يومًا التالية بنصف أجر.
      ج. المدة التي تلي ذلك بدون أجر.
      4. لا يُستحق الأجر عن الإجازة المرضية إذا كان المرض قد نشأ عن سوء سلوك العامل، وفق الحالات التي
      يصدر بتحديدها اللائحة التنفيذية لهذا المرسوم بقانون.
      5. لصاحب العمل إنهاء خدمة العامل بعد استنفاذ إجازته المرضية المشار إليها في هذه المادة، إذا تعذر عليه
      العودة إلى عمله، على أن يتقاضى العامل كافة مستحقاته المالية وفق أحكام هذا المرسوم بقانون ولائحته
      التنفيذية.
