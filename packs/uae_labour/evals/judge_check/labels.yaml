- id: jc-021
  rubric: grounding
  question: |-
    قدمت استقالتي بعد سبع سنوات من العمل بدوام كامل، وأنا عامل أجنبي. يقول زملائي إن المستقيل لا يحصل على مكافأة نهاية الخدمة كاملة. كيف يحسب قانون العمل المكافأة، وهل تختلف بين الاستقالة وإنهاء الخدمة من صاحب العمل؟
  answer:
    status: answered
    text: |-
      بموجب قانون العمل الإماراتي، يستحق العامل الأجنبي الذي يعمل بنظام الدوام الكامل، والذي أكمل سنة أو أكثر في الخدمة المستمرة، مكافأة نهاية الخدمة عند انتهاء خدمته، ولا يفرق القانون في استحقاق هذه المكافأة بين الاستقالة أو إنهاء الخدمة من قبل صاحب العمل.

      **كيفية احتساب المكافأة:**
      تُحسب المكافأة بناءً على الأجر الأساسي للعامل (بدون البدلات) وفقاً للمادة (51) من المرسوم بقانون اتحادي رقم (33) لسنة 2021 بشأن تنظيم علاقات العمل، وذلك على النحو التالي:
      1. أجر (21) يوماً عن كل سنة من سنوات الخدمة الخمس الأولى.
      2. أجر (30) يوماً عن كل سنة مما زاد على ذلك.
      3. تُستحق مكافأة عن أجزاء السنة بنسبة ما قضاه العامل منها في العمل، بشرط أن يكون قد أكمل سنة من الخدمة المستمرة.
      4. لا تدخل أيام الانقطاع عن العمل بدون أجر في حساب مدة الخدمة.
      5. تُحسب المكافأة وفق آخر أجر أساسي كان يتقاضاه العامل.
      6. لا يجوز أن تزيد مكافأة نهاية الخدمة في مجموعها عن أجر سنتين.

      *ملاحظة: هذه المعلومات هي توضيح للنصوص القانونية وليست استشارة قانونية.*
    citations:
    - labour-law Art 51
  sources:
  - id: labour-law:ar:51:1
    article: labour-law Art 51
    text: |-
      المادة (51)
      مكافأة نهاية الخدمة للعاملين بنمط الدوام الكامل
      1. يستحق العامل المواطن مكافأة نهاية الخدمة عند انتهاء خدمته وذلك وفقًا للتشريعات المنظمة للمعاشات
      والتأمينات الاجتماعية السارية في الدولة.
      2. يستحق العامل الأجنبي الذي يعمل وفق نمط العمل بالدوام الكامل، والذي أكمل سنة أو أكثر في الخدمة
      المستمرة مكافأة نهاية الخدمة عند انتهاء خدمته، تحسب وفق الأجر الأساسي، وذلك على النحو الآتي:
      أ. أجر (21) واحد وعشرين يوم عن كل سنة من سنوات الخدمة الخمس الأولى.
      ب. أجر (30) ثلاثين يوم عن كل سنة مما زاد على ذلك.
      3. يستحق العامل الأجنبي مكافأة عن أجزاء السنة بنسبة ما قضاه منها في العمل بشرط أن يكون قد أكمل
      سنة من الخدمة المستمرة.
      4. لا تدخل أيام الانقطاع عن العمل بدون أجر في حساب مدة الخدمة.
      5. مع عدم الإخلال بما تقرره التشريعات بشأن منح معاشات أو مكافآت تقاعد للعاملين في بعض المنشآت،
      تُحسب مكافأة نهاية الخدمة وفق آخر أجر أساسي كان يستحقه العامل الأجنبي بالنسبة إلى من يتقاضون
      أجورهم بالشهر أو بالأسبوع أو باليوم ووفق متوسط الأجر اليومي المنصوص عليه في أحكام هذا المرسوم
      بقانون لمن يتقاضون أجورهم بالقطعة.
      6. يشترط فيما تقدم ألا تزيد مكافأة نهاية الخدمة للعامل الأجنبي في مجموعها عن أجر سنتين.
      7. لصاحب العمل أن يقتطع من مكافأة نهاية الخدمة، أي مبالغ تكون مستحقة قانونًا أو بحكم قضائي،
      وفق الشروط والإجراءات التي تحددها اللائحة التنفيذية لهذا المرسوم بقان ون.
      8. لمجلس الوزراء، بناءً على اقتراح الوزير وبعد التنسيق مع الجهات المعنية، إقرار أنظمة أخرى بديلة لنظام
      مكافأة نهاية الخدمة، ويحدد القرار الصادر منه، شروط وضوابط وآلية الاشتراك في هذه الأنظمة.
