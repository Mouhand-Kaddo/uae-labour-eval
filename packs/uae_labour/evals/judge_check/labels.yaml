- id: jc-040
  rubric: grounding
  question: |-
    How many days of absence without a valid reason allow an employer to dismiss a worker without notice under the UAE Labour Law?
  answer:
    status: answered
    text: |-
      **Threshold: more than 7 consecutive days, or more than 20 non-consecutive days.**

      Under Article 44(8) of Federal Decree-Law No. 33 of 2021 (the Labour Law), the employer may dismiss the worker **without notice (warning allowance)** where the worker "is absent from work without a legitimate reason or an excuse acceptable to the Employer for more than twenty (20) non-consecutive days, or more than seven (7) consecutive days."

      Since the wording is "more than", the employer's right arises on the **8th consecutive day** of absence, or on the **21st non-consecutive day** — not on the 7th or 20th day itself.

      **Conditions attached to such a dismissal (Article 44, opening words):**
      - a **written investigation** with the worker must first be conducted;
      - the dismissal decision must be **in writing and reasoned**;
      - the employer or his representative must **hand the decision to the worker**.

      **Related provisions on the same absence:**
      - The employer must report the absence to the Ministry once it exceeds **7 consecutive days** and he has no knowledge of the worker's whereabouts or means of contacting him (Executive Regulations, Article 28(1)).
      - A foreign worker absent without a legitimate reason before the end of the contract period may not be granted another work permit for **one year** from the date of absence, and no employer aware of this may hire him during that period (Article 50(1); exceptions in Executive Regulations Article 28(2)).
      - A worker who does not return to work after his leave without a legitimate reason is not entitled to wages for the period of absence following the end of the leave (Article 34).
      - Days of absence without pay are **not included in the calculation of length of service** for end-of-service gratuity purposes (Article 51(4)); Article 44 dismissal is not itself listed in the Law as a ground for forfeiting the gratuity.

      This is general information about the text of the UAE Labour Law and its Executive Regulations, not legal advice on any particular situation.
    citations:
    - labour-law Art 44
    - labour-law Art 34
    - labour-law Art 50
    - labour-law Art 51
    - executive-regulations Art 28
  sources:
  - id: labour-law:en:44:1
    article: labour-law Art 44
    text: |-
      Article (44)
      Cases of Dismissal of Worker Without Warning
      The Employer may dismiss the Worker without warning, after conducting a written
      investigation with him, and the decision to dismiss shall be in writing and reasoned, and the
      Employer or his representative shall hand it to the Worker in any of the following cases:
      1. If it is proven that the Worker impersonates another person or has submitted false
      certificates or documents.
      2. If the Worker makes a mistake that results in a grave material loss to the Employer, or if
      the Worker deliberately harms the property of the Employer and acknowledges the same,
      provided that the latter shall inform the Ministry of the incident within seven (7) business
      days as of the time of his knowledge of the occurrence of the incident.
      3. If the Worker violates the instructions of the Establishment's internal system related to the
      safety of work and Workers or the workplace, provided that they are written and displayed
      in a visible place, and that the Worker has been informed thereof.
      4. If the Worker fails to perform his basic duties according to the employment contract and
      continues to breach them despite conducting a written investigation with him for this
      reason and warning him twice of dismissal in case of repetition.
  - id: executive-regulations:en:28:1
    article: executive-regulations Art 28
    text: |-
      Article (28)
      Controls for Reporting the Worker’s Absence from Work
      Subject to the provisions of Article (50) of the Decree-Law:
      1. The employer shall notify the Ministry of the worker’s absence from work in accordance with
      the following controls and procedures:
      a. The absence from work shall be for more than (7) consecutive days, without the
      employer’s knowledge of the worker’s whereabouts or the means of communication with
      him.
      b. The absence from work form shall be completed in accordance with the procedures
      determined by the Minister.
      2. In the event the worker is absent from work, for an unjustified reason, before the expiry of the
      contract’s term, he shall not be granted another work permit for a year starting from the date
      of absence of work, with the following exceptions:
      a. The worker who is sponsored by his parents.
      b. The worker who applies for a new work permit for the same establishment.
      c. The worker who has skill, professional or knowledge levels needed by the State.
      d. Holders of the golden residency.
      e. Any professional categories based on the needs of the labour market in the State
      stipulated in a resolution issued by the Minister under the manpower classification
      approved by the Cabinet.
      3. The Minister may issue a resolution determining the mechanisms of reporting the absence
      from work in accordance with the applicable digital system at the Ministry.
  - id: labour-law:en:34:1
    article: labour-law Art 34
    text: |-
      Article (34)
      Absence After Leave
      The Worker who does not return directly to work without a legitimate reason after the end of
      his leave shall not be entitled to his wage for the period of absence following the end of the
      leave.
  - id: labour-law:en:44:2
    article: labour-law Art 44
    text: |-
      5. If the Worker discloses any of the work secrets related to industrial or intellectual property,
      which results in losses to the Employer, missing an opportunity for the Employer or
      gaining a personal benefit to the Worker.
      6. If during working hours he is found drunk or under the influence of a narcotic or
      psychotropic substance or has committed an act contrary to public morals in the
      workplace.
      7. If in the course of his work, the Worker commits, against the Employer, the manager or
      any of his superiors or colleagues, a verbal or physical assault or any other form of assault
      punishable under the laws in force in the State.
      8. If the Worker is absent from work without a legitimate reason or an excuse acceptable to
      the Employer for more than twenty (20) non-consecutive days, or more than seven (7)
      consecutive days.
      9. If the Worker illegally exploits his job position to obtain personal results and gains.
      10. If the Worker works for another Establishment without complying with the controls and
      procedures established in this regard.
  - id: labour-law:en:50:1
    article: labour-law Art 50
    text: |-
      Article (50)
      Unlawful Absence from Work
      1. If the foreign Worker is absent from work, for no legitimate reason, before the end of the
      contract period, no other work permit shall be granted thereto to join other work in the
      State in accordance with the provisions of this Decree by law, for a period of one year as
      of the date of the absence from work. Also, no other Employer who knows of the foregoing
      may employ him or keep him in his service during that period.
      2. The Ministry may exempt some job categories, skill levels, or labor from the provisions of
      Clause (1) of this Article, in accordance with the controls and procedures specified by the
      Executive Regulation of this Decree by law.
      3. The Employer shall notify the Ministry of the incident of absence from work in accordance
      with the procedures specified in the Executive Regulation of this Decree by law.
  - id: labour-law:en:51:1
    article: labour-law Art 51
    text: |-
      Article (51)
      End-of-Service Gratuity for Full-Time Workers
      1. The national Worker is entitled to an end-of-service gratuity upon the end of his service,
      in accordance with the legislation regulating pensions and social security in force in the
      State.
      2. The foreign full-time Worker, who has completed one or more years of continuous service,
      is entitled to an end-of-service gratuity upon the end of his service, calculated according
      to the basic wage, as follows:
      a. The wage of twenty-one (21) days for each year of the first five years of service.
      b. The wage of thirty (30) days for each year in excess of that.
      3. The foreign Worker is entitled to a bonus for parts of the year in proportion to the amount
      spent in work, provided that he has completed one year of continuous service.
      4. The days of absence from work without pay shall not be included in the calculation of the
      duration of service.
      5. Without prejudice to what is decided by legislation regarding the granting of pensions or
      retirement benefits to Workers in some Establishments, the end-of-service gratuity shall
      be calculated according to the last basic wage received by the foreign Worker, for those
      who receive their wages by month, week, or day, and according to the average daily wage
      stipulated in the provisions of this Decree by law for those who receive their wages by
      piece-meal.
      6. The foregoing is provided that the total end-of-service gratuity for the foreign Worker does
      not exceed two years' wage.
  - id: labour-law:en:51:2
    article: labour-law Art 51
    text: |-
      7. The Employer may deduct from the end-of-service gratuity any amounts that are due by
      law or by a judgment, in accordance with the conditions and procedures specified by the
      Executive Regulation of this Decree by law.
      8. The Cabinet may, upon the proposal of the Minister and after coordination with the
      Concerned Authorities, approve other alternative systems for the end-of-service gratuity
      system, and the decision issued thereby shall specify the conditions, controls and
      mechanism of contribution to these systems.
