- id: jc-034
  rubric: bilingual
  question:
    en: |-
      I'm a foreign worker on a full-time contract. I started work on 1 January 2020 and my last day of work was 31 December 2022. My basic wage is AED 7,300 a month and my total wage with allowances is AED 10,000. How much end-of-service gratuity am I owed?
    ar: |-
      أنا عامل أجنبي بعقد دوام كامل. بدأت العمل في 1 يناير 2020 وكان آخر يوم عمل لي 31 ديسمبر 2022. أجري الأساسي 7,300 درهم شهريًا وأجري الإجمالي مع البدلات 10,000 درهم. ما مقدار مكافأة نهاية الخدمة المستحقة لي؟
  answer:
    en:
      status: answered
      text: |-
        **Your end-of-service gratuity is AED 15,133.81.**

        How it was calculated (Federal Decree-Law No. 33 of 2021):

        1. **Entitlement** – As a foreign full-time worker with more than one year of continuous service, you are entitled to a gratuity of 21 days' wage for each of your first five years of service (Article 51(2)(a)).
        2. **Length of service** – 1 January 2020 to 31 December 2022 = 1,096 days, counted on the Gregorian calendar with a year deemed to be 365 days (Article 67). No unpaid absence days were deducted (Article 51(4)).
        3. **Gratuity days** – 1,096 ÷ 365 = 3.0027 years × 21 days = **63.0575 days**, including the pro-rata bonus for the part year of service (Article 51(3)).
        4. **Wage used** – The gratuity is calculated on the **last basic wage**, not the total wage with allowances (Article 51(2) and 51(5)): AED 7,300 × 12 ÷ 365 = **AED 240.00 per day**. (Your AED 10,000 total wage is therefore not the basis for gratuity.)
        5. **Amount** – 63.0575 days × AED 240.00 = **AED 15,133.81**.
        6. **Cap check** – The gratuity may not exceed two years' wage (Article 51(6)); the ceiling here would be AED 175,200, so no cap applies.

        Note: this is a statutory calculation based on the figures you supplied, not legal advice.
      citations:
      - labour-law Art 51
      - labour-law Art 67
    ar:
      status: answered
      text: |-
        مكافأة نهاية الخدمة المستحقة لك وفق المعطيات التي ذكرتها: **15,133.81 درهم إماراتي**.

        **كيف تم الحساب:**

        أنت عامل أجنبي بنمط الدوام الكامل، وتحسب مكافأتك عن مدة خدمة مستمرة بلغت 1,096 يومًا (من 1 يناير 2020 إلى 31 ديسمبر 2022)، أي ما يعادل 3.0027 سنة ميلادية (السنة = 365 يومًا والشهر = 30 يومًا وفق المادة 67).

        | البند | القيمة |
        |---|---|
        | مدة الخدمة | 1,096 يومًا (3.0027 سنة) |
        | أيام الانقطاع بدون أجر | 0 |
        | مدة الخدمة المعتمدة للحساب | 1,096 يومًا |
        | الأجر اليومي الأساسي | 240.00 درهم (7,300 × 12 ÷ 365) |
        | أيام المكافأة | 63.0575 يومًا (21 يومًا × 3.0027 سنة) |
        | **المكافأة** | **15,133.81 درهمًا** |
        | السقف القانوني (أجر سنتين) | 175,200 درهمًا — لم يُطبَّق |

        **الأساس القانوني:**
        - المادة (51/2) من المرسوم بقانون اتحادي رقم 33 لسنة 2021: تستحق مكافأة نهاية الخدمة عن الدوام الكامل بواقع أجر 21 يومًا عن كل سنة من سنوات الخدمة الخمس الأولى، وتحسب **من الأجر الأساسي** — لذلك اعتمدنا 7,300 درهم وليس 10,000 درهم (الأجر مع البدلات لا يدخل في الحساب).
        - المادة (51/3): تُحسب لك مكافأة عن أجزاء السنة بنسبة ما قضيتَه منها في العمل، لأنك أكملت سنة من الخدمة المستمرة. وهذا سبب ظهور الكسر 3.0027 سنة و63.0575 يومًا بدل 63 يومًا تمامًا.
        - المادة (51/5): تُحسب المكافأة وفق **آخر أجر أساسي** كنت تستحقه، وأنت تتقاضى أجرك شهريًا.
        - المادة (51/6): يشترط ألا تتجاوز المكافأة في مجموعها أجر سنتين، وسقفك هنا 175,200 درهمًا ولا يؤثر على النتيجة.
        - المادة (51/4): لا تُحتسب أيام الانقطاع عن العمل بدون أجر في مدة الخدمة، ولم تذكر أي انقطاع.
        - المادة (67): حساب المدد بالتقويم الميلادية، والسنة 365 يومًا والشهر 30 يومًا — ومنها اشتُقّ الأجر اليومي (240 درهمًا).

        ملاحظة: هذه معلومة قانونية عامة محسوبة من المعطيات التي قدّمتها، وليست استشارة قانونية.
      citations:
      - labour-law Art 51
      - labour-law Art 67
  sources:
  - id: labour-law:en:51:1
    article: labour-law Art 51
    text: |-
      Article (51)
      End-of-Service Gratuity for Full-Time Workers
      1. The national Worker is entitled to an end-of-service gratuity upon the end of his service,
      in accordance with the legislation regulating pensions and social security in force in the
      State.
      2. The foreign full-time Worker, who has completed one or more years of continuous service,
      is entitled to an end-of-service gratuity upon the end of his service, calculated according
      to the basic wage, as follows:
      a. The wage of twenty-one (21) days for each year of the first five years of service.
      b. The wage of thirty (30) days for each year in excess of that.
      3. The foreign Worker is entitled to a bonus for parts of the year in proportion to the amount
      spent in work, provided that he has completed one year of continuous service.
      4. The days of absence from work without pay shall not be included in the calculation of the
      duration of service.
      5. Without prejudice to what is decided by legislation regarding the granting of pensions or
      retirement benefits to Workers in some Establishments, the end-of-service gratuity shall
      be calculated according to the last basic wage received by the foreign Worker, for those
      who receive their wages by month, week, or day, and according to the average daily wage
      stipulated in the provisions of this Decree by law for those who receive their wages by
      piece-meal.
      6. The foregoing is provided that the total end-of-service gratuity for the foreign Worker does
      not exceed two years' wage.
  - id: labour-law:en:51:2
    article: labour-law Art 51
    text: |-
      7. The Employer may deduct from the end-of-service gratuity any amounts that are due by
      law or by a judgment, in accordance with the conditions and procedures specified by the
      Executive Regulation of this Decree by law.
      8. The Cabinet may, upon the proposal of the Minister and after coordination with the
      Concerned Authorities, approve other alternative systems for the end-of-service gratuity
      system, and the decision issued thereby shall specify the conditions, controls and
      mechanism of contribution to these systems.
  - id: labour-law:en:67:1
    article: labour-law Art 67
    text: |-
      Article (67)
      Calculation of Periods and Dates
      The periods and dates referred to in this Decree by law shall be calculated according to the
      Gregorian calendar; and in the implementation of this Decree by law, a calendar year shall be
      deemed as three hundred and sixty-five (365) days, and the month shall be deemed as thirty
      (30) days.
  - id: labour-law:ar:51:1
    article: labour-law Art 51
    text: |-
      المادة (51)
      مكافأة نهاية الخدمة للعاملين بنمط الدوام الكامل
      1. يستحق العامل المواطن مكافأة نهاية الخدمة عند انتهاء خدمته وذلك وفقًا للتشريعات المنظمة للمعاشات
      والتأمينات الاجتماعية السارية في الدولة.
      2. يستحق العامل الأجنبي الذي يعمل وفق نمط العمل بالدوام الكامل، والذي أكمل سنة أو أكثر في الخدمة
      المستمرة مكافأة نهاية الخدمة عند انتهاء خدمته، تحسب وفق الأجر الأساسي، وذلك على النحو الآتي:
      أ. أجر (21) واحد وعشرين يوم عن كل سنة من سنوات الخدمة الخمس الأولى.
      ب. أجر (30) ثلاثين يوم عن كل سنة مما زاد على ذلك.
      3. يستحق العامل الأجنبي مكافأة عن أجزاء السنة بنسبة ما قضاه منها في العمل بشرط أن يكون قد أكمل
      سنة من الخدمة المستمرة.
      4. لا تدخل أيام الانقطاع عن العمل بدون أجر في حساب مدة الخدمة.
      5. مع عدم الإخلال بما تقرره التشريعات بشأن منح معاشات أو مكافآت تقاعد للعاملين في بعض المنشآت،
      تُحسب مكافأة نهاية الخدمة وفق آخر أجر أساسي كان يستحقه العامل الأجنبي بالنسبة إلى من يتقاضون
      أجورهم بالشهر أو بالأسبوع أو باليوم ووفق متوسط الأجر اليومي المنصوص عليه في أحكام هذا المرسوم
      بقانون لمن يتقاضون أجورهم بالقطعة.
      6. يشترط فيما تقدم ألا تزيد مكافأة نهاية الخدمة للعامل الأجنبي في مجموعها عن أجر سنتين.
      7. لصاحب العمل أن يقتطع من مكافأة نهاية الخدمة، أي مبالغ تكون مستحقة قانونًا أو بحكم قضائي،
      وفق الشروط والإجراءات التي تحددها اللائحة التنفيذية لهذا المرسوم بقان ون.
      8. لمجلس الوزراء، بناءً على اقتراح الوزير وبعد التنسيق مع الجهات المعنية، إقرار أنظمة أخرى بديلة لنظام
      مكافأة نهاية الخدمة، ويحدد القرار الصادر منه، شروط وضوابط وآلية الاشتراك في هذه الأنظمة.
  - id: labour-law:ar:67:1
    article: labour-law Art 67
    text: |-
      المادة (67)
      حساب المدد والمواعيد
      يكون حساب المدد والمواعيد المنصوص عليها في هذا المرسوم بقانون بالتقويم الميلادي، وتعد السنة الميلادية
      في تطبيق أحكام هذا المرسوم بقانون (365) ثلاثمائة وخمس وستون يومًا والشهر (30) ثلاثون يومًا.
  criteria:
    same_conclusion:
      rule: |-
        Both answers reach the same outcome: the same status (answered, refused or not found), the same
        yes or no, the same figure, and the same entitlement or obligation. Fail if a person reading only
        one of the answers would come away with a different result than a person reading only the other.
      label: pass
    same_details:
      rule: |-
        Every substantive point in one answer is also in the other with the same value: each period,
        amount, rate, condition, exception and next step it gives. Fail if one answer adds, omits or
        changes such a point. Restating the question, a disclaimer, or a courtesy phrase is not a
        substantive point.
      label: pass
