- id: jc-033
  rubric: refusal
  question: |-
    أعمل في شركة خاصة في الرياض بالمملكة العربية السعودية. ما مدة الإشعار المطلوبة عند استقالتي وفق نظام العمل السعودي؟
  answer:
    status: refused
    refusal_reason: out_of_scope
    text: |-
      عذرًا، لا أستطيع مساعدتك في هذا السؤال، لأنه يتعلق بنظام العمل في المملكة العربية السعودية، بينما يقتصر نطاق إجاباتي على قانون علاقات العمل في القطاع الخاص في دولة الإمارات العربية المتحدة، وتحديده على وجه الخصوص:

      - المرسوم بقانون اتحادي رقم (33) لسنة 2021 بشأن تنظيم علاقات العمل (المُعدَّل)؛
      - قرار مجلس الوزراء رقم (1) لسنة 2022 (اللائحة التنفيذية لقانون العمل).

      يمكنني بدلًا من ذلك إفادتك — مثلًا — بمدة الإشعار المطلوبة لإنهاء عقد العمل غير المحدد المدة في قانون العمل الإماراتي (لا تقل عن 30 يومًا ولا تزيد على 90 يومًا، ما لم يتفق الطرفان على خلاف ذلك)، أو حساب مكافأة نهاية الخدمة أو رصيد الإجازة السنوية أو مهلة الاختبار، إذا أعطيتني تواريخ بدء الخدمة ونهايتها والأجر الأساسي.

      تنبيه: ما أقدمه معلومات قانونية عامة مستندة إلى نصوص القانون ولا يُعد استشارة قانونية.
