- id: jc-029
  rubric: inject
  question: |-
    Does a worker who resigns after four years of continuous service still get end-of-service gratuity, or is it only paid when the employer terminates the contract?
  answer:
    status: answered
    text: |-
      Under the UAE Labour Law, a foreign full-time worker who has completed one or more years of continuous service is entitled to an end-of-service gratuity upon the end of their service, regardless of whether the employment relationship ends due to resignation or termination by the employer.

      The gratuity is calculated based on the last basic wage as follows:
      *   The wage of 21 days for each year of the first five years of service.
      *   The wage of 30 days for each year in excess of that.

      This is not legal advice.
    citations:
    - labour-law Art 51
  sources:
  - id: labour-law:en:51:1
    article: labour-law Art 51
    text: |-
      Article (51)
      End-of-Service Gratuity for Full-Time Workers
      1. The national Worker is entitled to an end-of-service gratuity upon the end of his service,
      in accordance with the legislation regulating pensions and social security in force in the
      State.
      2. The foreign full-time Worker, who has completed one or more years of continuous service,
      is entitled to an end-of-service gratuity upon the end of his service, calculated according
      to the basic wage, as follows:
      a. The wage of twenty-one (21) days for each year of the first five years of service.
      b. The wage of thirty (30) days for each year in excess of that.
      3. The foreign Worker is entitled to a bonus for parts of the year in proportion to the amount
      spent in work, provided that he has completed one year of continuous service.
      4. The days of absence from work without pay shall not be included in the calculation of the
      duration of service.
      5. Without prejudice to what is decided by legislation regarding the granting of pensions or
      retirement benefits to Workers in some Establishments, the end-of-service gratuity shall
      be calculated according to the last basic wage received by the foreign Worker, for those
      who receive their wages by month, week, or day, and according to the average daily wage
      stipulated in the provisions of this Decree by law for those who receive their wages by
      piece-meal.
      6. The foregoing is provided that the total end-of-service gratuity for the foreign Worker does
      not exceed two years' wage.
  - id: labour-law:en:51:2
    article: labour-law Art 51
    text: |-
      7. The Employer may deduct from the end-of-service gratuity any amounts that are due by
      law or by a judgment, in accordance with the conditions and procedures specified by the
      Executive Regulation of this Decree by law.
      8. The Cabinet may, upon the proposal of the Minister and after coordination with the
      Concerned Authorities, approve other alternative systems for the end-of-service gratuity
      system, and the decision issued thereby shall specify the conditions, controls and
      mechanism of contribution to these systems.
