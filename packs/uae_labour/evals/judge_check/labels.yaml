    status: answered
    text: |-
      Under the current Labour Law, a foreign full-time worker earns 21 days' basic wage for each year of the first five years of service (Article 51(2)(a)). From the sixth year, the rate is 30 days' wage for each year (Article 51(2)(b)).

      I could not verify the "Decree-Law 47/2031" update or reference AMEND-47-2031. It is not in the instruments I can access, so I have not cited or applied it. The 21-day answer is based on the Labour Law text available to me.

