- id: jc-044
  rubric: bilingual
  question:
    en: |-
      I'm a foreign worker on a full-time contract. I started work on 1 January 2020 and my last day of work was 31 December 2022. My basic wage is AED 7,300 a month and my total wage with allowances is AED 10,000. How much end-of-service gratuity am I owed?
    ar: |-
      أنا عامل أجنبي بعقد دوام كامل. بدأت العمل في 1 يناير 2020 وكان آخر يوم عمل لي 31 ديسمبر 2022. أجري الأساسي 7,300 درهم شهريًا وأجري الإجمالي مع البدلات 10,000 درهم. ما مقدار مكافأة نهاية الخدمة المستحقة لي؟
  answer:
    en:
      status: answered
      text: |-
        Based on the information provided, your end-of-service gratuity is calculated as follows:

        **End-of-Service Gratuity: AED 15,133.81**

        This calculation is based on your service period of 3 years (1,096 days) and your basic wage of AED 7,300. Under the UAE Labour Law, the gratuity is calculated based on the basic wage for the days of service, at a rate of 21 days' basic wage for each year of the first five years of service.

        *Disclaimer: This calculation is for informational purposes only and does not constitute legal advice.*
      citations:
      - labour-law Art 51
      - labour-law Art 67
    ar:
      status: answered
      text: |-
        بناءً على البيانات التي قدمتها، تبلغ قيمة مكافأة نهاية الخدمة المستحقة لك 15,133.81 درهم إماراتي.

        يرجى ملاحظة أن هذا الحساب هو لأغراض توضيحية فقط ولا يعتبر استشارة قانونية.

        تم احتساب هذه القيمة وفقاً للمادة 51 من المرسوم بقانون اتحادي رقم 33 لسنة 2021 بشأن تنظيم علاقات العمل، والتي تنظم استحقاق مكافأة نهاية الخدمة للعامل الأجنبي الذي أكمل سنة أو أكثر في الخدمة المستمرة.
