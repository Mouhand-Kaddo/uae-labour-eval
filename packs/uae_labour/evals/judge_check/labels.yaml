- id: jc-019
  rubric: grounding
  question: |-
    I started my job eight months ago. How much annual leave does the UAE Labour Law give me for my service so far, and how much will I get once I have completed a full year?
  answer:
    status: answered
    text: |-
      Under the UAE Labour Law, your annual leave entitlement is determined as follows:

      *   **For a full year of service:** You are entitled to 30 days of annual leave with full pay for each year of service (Article 29(1)(a) of the Labour Law).
      *   **For your current service (8 months):** Since your service period is more than six months but less than one year, you are entitled to 2 days of leave for each month of service (Article 29(1)(b) of the Labour Law). Based on eight months of service, this would amount to 16 days of leave.

      Please note that this information is for educational purposes and does not constitute legal advice.
    citations:
    - labour-law Art 29
  sources:
  - id: labour-law:en:29:1
    article: labour-law Art 29
    text: |-
      Article (29)
      Annual leave
      1. Without prejudice to the Worker's rights acquired for the period preceding the date of
      enforcement of the provisions of this Decree by law, the Worker shall be entitled to an
      annual leave with full pay of not less than:
      a. Thirty days for each year of his extended service.
      b. Two days for each month if his service period is more than six months and less than
      one year.
      c. A leave for parts of the last year he spent at work, in the event that his service ends
      before using his annual leave balance.
      2. The part-time Worker is entitled to an annual leave according to the actual working hours
      spent by the Worker with the Employer, the duration of which is specified in the
      employment contract, in accordance with what is determined by the Executive Regulation
      of this Decree by law.
      3. The Employer may agree to grant the Worker a leave from the balance of his annual leave
      during the Probation Period, and the Worker shall retain the right to be compensated for
      the remainder of his annual leave balance, if he have not passed the Probation Period.
      4. The Worker must enjoy his leave in the year of its entitlement, and the Employer may
      determine the dates of these leaves in accordance with work requirements and in
      agreement with the Worker or grant them in rotation among the Establishment's Workers
      in order to ensure the progress of his work, and he must notify the Worker of the specified
      date for enjoying his leave at least one month in advance.
  - id: labour-law:en:29:2
    article: labour-law Art 29
    text: |-
      1. The Worker may, upon the approval of the Employer and in accordance with the
      applicable organizational regulations in the Establishment, carry forward the balance of
      his annual leave, or days thereof, to the following year.
      6. The Worker is entitled to the wage for the period of his annual leave.
      7. Rest days established by law or by agreement shall be included in the annual leave period
      if the annual leave enjoyed by the Worker is interrupted by, and is considered, part of it,
      unless the employment contract or the organizational regulations in force in the
      Establishment stipulate what is more beneficial to the Worker.
      8. The Employer may not prevent the Worker from benefiting from his entitled annual leave
      for more than two years, unless the Worker wishes to carry it forward or obtain a cash
      allowance for it in accordance with the organizational regulations in force in the
      Establishment, and what is specified by the Executive Regulation of this Decree by law.
      9. The Worker is entitled to receive wages for the days of the entitled rest days if he leaves
      the work before using it, regardless of their duration, in relation to the period for which he
      has not obtained his leave.
      10. The Executive Regulation of this Decree by law shall specify the rules and conditions for
      organizing vacations and compensation for them.
