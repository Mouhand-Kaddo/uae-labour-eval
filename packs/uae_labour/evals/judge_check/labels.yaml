- id: jc-004
  rubric: grounding
  question: |-
    Under the UAE Labour Law, how much maternity leave is a female worker entitled to, how much of it is paid, and can she take more time off afterwards if she or her baby is ill?
  answer:
    status: answered
    text: |-
      Under Article 30 of the Labour Law:

      1. **Length:** A female worker is entitled to 60 days of maternity leave (Art. 30(1)). This applies if she gives birth after six months or more of pregnancy, whether the baby is born dead or born alive and then dies (Art. 30(3)). She may request it at any time from the last day of the month before the expected birth month, supported by a certificate from the Medical Authority (Art. 30(5)).

      2. **Pay:** The first 45 days are paid in full. The following 15 days are paid at half pay (Art. 30(1)(a)–(b)).

      3. **Illness after leave:** Yes, in two situations.
         - **Her or her child's illness from pregnancy or childbirth:** After using her maternity leave, she may take unpaid absence of up to 45 consecutive or intermittent days if the illness is caused by pregnancy or childbirth (for her or her child) and prevents her from returning to work. The illness must be proven by a medical certificate from the Medical Authority. This period does not count as service for end-of-service gratuity or retirement contributions (Art. 30(2)).
         - **A sick or disabled child needing a constant companion:** If she gives birth to a child whose health requires a constant companion, under a Medical Authority report, she gets 30 days' leave on full pay starting after the maternity leave ends. She may extend it by 30 days without pay (Art. 30(4)).

      Taking this leave does not affect her right to other leave (Art. 30(6)), and she cannot be dismissed or given notice because of pregnancy or leave (Art. 30(8)).

      This is general information about the law, not legal advice.

      Sources: Labour Law Art. 30.
    citations:
    - labour-law Art 30
  sources:
  - id: labour-law:en:30:1
    article: labour-law Art 30
    text: |-
      Article (30)
      Maternity Leave
      1. The female Worker shall be entitled to maternity leave of (60) sixty days, according to the
      following:
      a. The first forty-five (45) days with full pay.
      b. The following fifteen (15) days with half pay.
      2. The female Worker may, after using her maternity leave, be absent work without pay for
      a period not exceeding forty-five (45) consecutive or intermittent days, if such absence is
      due to an illness suffered by her or her child as a result of pregnancy or childbirth and that
      does not enable her to return to her work. Said illness shall be proven by a medical
      certificate issued by the Medical Authority, and this period shall not be included in the
      period of service for which the female Worker is entitled to the end of service gratuity or
      the period of contribution to the retirement system in accordance with the legislation in
      force in this regard.
      3. The female Worker is entitled to the maternity leave stated in Clause (1) of this Article, if
      she gives birth after six (6) months or more of pregnancy, whether the foetus is born dead
      or born alive then died.
  - id: labour-law:en:30:2
    article: labour-law Art 30
    text: |-
      4. The female Worker, in the event that she gives birth to a sick or disabled child whose
      health condition requires a constant companion according to a medical report issued by
      the Medical Authority, is entitled to a leave of thirty (30) days with full pay starting after
      the end of the maternity leave period, and she has the right to extend the leave for a period
      of thirty (30) days without pay.
      5. The Employer must grant the female Worker maternity leave whenever she requests it at
      any time, starting as of the last day of the month immediately preceding the month in
      which she is expected to give birth, and this shall be proven by a certificate from the
      Medical Authority.
      6. Obtaining the maternity leave or the absence referred to in this Article shall not prejudice
      her right to obtain other leaves.
      7. If the female Worker works for another Employer during the period of her leave
      authorized in this article, the original Employer may deprive her of her wage for the period
      of the leave or recover what he paid to her.
      8. It is not permissible to terminate the service of a female Worker or to give her notice
      because of pregnancy, or because she has obtained maternity leave, or because she is
      absent from work in accordance with the provisions of this Article.
  - id: labour-law:en:30:3
    article: labour-law Art 30
    text: |-
      9. After returning from maternity leave and for a period not exceeding six (6) months as of
      the date of giving birth, the female Worker is entitled to one or two rest periods per day to
      breastfeed her child, provided that the period of both periods shall not exceed one hour.
  - id: labour-law:ar:30:1
    article: labour-law Art 30
    text: |-
      المادة (30)
      إجازة الوضع
      1. تستحق العاملة إجازة وضع مدتها (60) ستين يومًا وفق ما يأتي:
      أ. (45) خمسة وأربعين يومًا الأولى بأجر كامل.
      ب. (15) خمسة عشر يومًا التي تليها بنصف أجر.
      2. للعاملة بعد استنفادها إجازة الوضع أن تنقطع عن العمل بدون أجر لمدة لا تزيد على (45) خمسة وأربعين
      يومًا متصلة أو متقطعة، إذا كان هذا الانقطاع بسبب مرض أصابها أو أصاب طفلها ناتج عن الحمل أو
      الوضع ولا يمكنها من العودة إلى عملها، ويثبت المرض بشهادة طبية صادرة عن الجهة الطبية، ولا تدخل
      هذه المدة ضمن مدة الخدمة التي تستحق عنها العاملة مكافأة نهاية الخدمة أو مدة الاشتراك في نظام
      التقاعد وفق التشريعات النافذة في هذا الشأن.
      3. تستحق العاملة إجازة الوضع المذكورة في البند رقم (1) من هذه المادة، إذا تم الوضع بعد (6) ستة أشهر
      أو أكثر من الحمل، سواءً ولد الجنين ميتًا أو ولد حيًّا ثم مات.
      4. للعاملة، في حالة إنجاب طفل مريض أو من ذوي الإعاقة "أصحاب الهمم"، وتتطلب حالته الصحية مرافقًا
      مستمرًا له وفق تقرير طبي صادر من الجهة الطبية، الحق في إجازة مدتها (30) ثلاثين يومًا بأجر كامل تبدأ
      بعد انتهاء مدة إجازة الوضع، ولها الحق في تمديد الإجازة لمدة (30) ثلاثين يومًا دون أجر.
      5. على صاحب العمل منح العاملة إجازة وضع متى طلبتها في أي وقت اعتبارًا من اليوم الأخير للشهر السابق
      مباشرةً على الشهر المتوقع الوضع فيه، ويثبت ذلك بموجب شهادة من الجهة الطبية.
      6. لا يخل حصول العاملة على إجازة الوضع أو الانقطاع المشار إليها في هذه المادة، بحقها في الحصول على
      الإجازات الأخرى.
  criteria:
    claims_supported:
      rule: |-
        Every claim in the answer (each period, amount, percentage, condition, duty, right and
        exception) is stated in, or follows directly from, the cited text. Fail if any claim is missing
        from the cited text, contradicts it, or is broader or more certain than the text allows. Fail if
        there is no cited text. Wording that only restates the question, or says the answer is not legal
        advice, is not a claim.
      label: pass
    citations_relevant:
      rule: |-
        Each cited article supports at least one claim in the answer. Fail if any citation is padding:
        an article whose retrieved text has nothing to do with what the answer says.
      label: pass
