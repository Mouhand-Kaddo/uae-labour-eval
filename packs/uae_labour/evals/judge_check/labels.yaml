- id: jc-022
  rubric: grounding
  question: |-
    Under the UAE Labour Law's Executive Regulations, when a worker's service ends, on which wage is the cash payment for their unused annual leave balance calculated?
  answer:
    status: answered
    text: |-
      On the worker's basic wage (basic salary) — not the total wage.

      Article 19 of the Executive Regulations (Cabinet Resolution No. 1 of 2022) sets out two different bases:
      - Clause 1 (during employment, by agreement): the worker may carry forward up to half of his annual leave into the following year, or agree with the employer to receive its cash equivalent "in accordance with the wage he earns at the time the leave is due" — i.e. the full wage.
      - Clause 2 (on termination of service): "In the event the worker's service is terminated, he shall be entitled to receive a cash equivalent of the balance of his annual leaves due by law in accordance with his basic salary."

      Why the distinction matters: Article 1 of Federal Decree-Law No. 33 of 2021 defines the Basic Wage as the wage specified in the employment contract (monthly, weekly, daily, hourly or piece-meal) which "does not include any other allowances or benefits in kind", while the Wage is the basic wage plus cash allowances and benefits in kind (cost-of-living allowances, percentage of sales or profits, etc.).

      Related provisions in the Law: Article 29(1)(c) entitles the worker to leave for the part of the last year worked where service ends before he uses his balance; Article 29(9) entitles him to wages for accrued unused leave days if he leaves the work before using them, "regardless of their duration"; Article 29(10) delegates to the Executive Regulation the rules and conditions for organising vacations and compensating for them — the source of the basic-salary basis in Article 19(2).

      Point to note: Article 29(1) and 29(6) of the Decree-Law speak of annual leave being "with full pay" / of the worker being entitled to "the wage for the period of his annual leave", whereas Article 19(2) of the Executive Regulations fixes the end-of-service cash equivalent at basic salary. The Executive Regulation is the provision that specifically governs the payment of an unused balance on termination and uses the basic salary, but the texts do not expressly resolve whether a worker could claim the full-wage basis under Article 29 for that payment.

      This is a general explanation of the statutory text, not legal advice.
    citations:
    - executive-regulations Art 19
    - labour-law Art 1
    - labour-law Art 29
  sources:
  - id: executive-regulations:en:19:1
    article: executive-regulations Art 19
    text: |-
      Article (19)
      Carrying Forward the Annual Leave or Earning Cash Renumeration Instead
      Subject to the provisions of clauses (8) and (9) of Article (29) of the Decree-Law:
      1. The worker may carry forward, into the following year, what does not exceed half of the
      annual leave or agree with the employer to receive its equivalent in cash in accordance with
      the wage he earns at the time the leave is due.
      2. In the event the worker’s service is terminated, he shall be entitled to receive a cash equivalent
      of the balance of his annual leaves due by law in accordance with his basic salary.
  - id: labour-law:en:29:1
    article: labour-law Art 29
    text: |-
      Article (29)
      Annual leave
      1. Without prejudice to the Worker's rights acquired for the period preceding the date of
      enforcement of the provisions of this Decree by law, the Worker shall be entitled to an
      annual leave with full pay of not less than:
      a. Thirty days for each year of his extended service.
      b. Two days for each month if his service period is more than six months and less than
      one year.
      c. A leave for parts of the last year he spent at work, in the event that his service ends
      before using his annual leave balance.
      2. The part-time Worker is entitled to an annual leave according to the actual working hours
      spent by the Worker with the Employer, the duration of which is specified in the
      employment contract, in accordance with what is determined by the Executive Regulation
      of this Decree by law.
      3. The Employer may agree to grant the Worker a leave from the balance of his annual leave
      during the Probation Period, and the Worker shall retain the right to be compensated for
      the remainder of his annual leave balance, if he have not passed the Probation Period.
      4. The Worker must enjoy his leave in the year of its entitlement, and the Employer may
      determine the dates of these leaves in accordance with work requirements and in
      agreement with the Worker or grant them in rotation among the Establishment's Workers
      in order to ensure the progress of his work, and he must notify the Worker of the specified
      date for enjoying his leave at least one month in advance.
  - id: labour-law:en:29:2
    article: labour-law Art 29
    text: |-
      1. The Worker may, upon the approval of the Employer and in accordance with the
      applicable organizational regulations in the Establishment, carry forward the balance of
      his annual leave, or days thereof, to the following year.
      6. The Worker is entitled to the wage for the period of his annual leave.
      7. Rest days established by law or by agreement shall be included in the annual leave period
      if the annual leave enjoyed by the Worker is interrupted by, and is considered, part of it,
      unless the employment contract or the organizational regulations in force in the
      Establishment stipulate what is more beneficial to the Worker.
      8. The Employer may not prevent the Worker from benefiting from his entitled annual leave
      for more than two years, unless the Worker wishes to carry it forward or obtain a cash
      allowance for it in accordance with the organizational regulations in force in the
      Establishment, and what is specified by the Executive Regulation of this Decree by law.
      9. The Worker is entitled to receive wages for the days of the entitled rest days if he leaves
      the work before using it, regardless of their duration, in relation to the period for which he
      has not obtained his leave.
      10. The Executive Regulation of this Decree by law shall specify the rules and conditions for
      organizing vacations and compensation for them.
