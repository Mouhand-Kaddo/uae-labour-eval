- id: cite-en-013
  category: cite
  language: en
  input: >-
    I resigned after two years and four months and never used my annual leave. Under the UAE
    Labour Law, am I paid for the unused leave, does that include the four months of my last,
    incomplete year, and on which wage is it calculated?
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "29"}
  scoring: [status, citations, "judge:grounding"]
  reviewed: false
  refs: ["Labour Law Art 29(9)"]
  depends_on: [OQ-004]
  rationale: >-
    Arabic Art 29(9): "يحق للعامل الحصو ل على أجرة أيام الإجازة المستحقة إذا ترك العمل قبل استعماله
    لها، أيًّا كانت مدتها ... كما يستحق أجرة الإجازة عن أجزاء السنة بنسبة ما قضاه منها في العمل،
    وتحسب وفق الأجر الأساسي." (the ingested text splits "الحصو ل"). The English 29(9) has the
    first sentence but not the pro-rata sentence or the basic-wage basis; OQ-004 decides the
    Arabic sentence is the law in both languages and English answers state it. Expected answer:
