  scoring: [status, citations]
  reviewed: false
  refs: ["Labour Law Art 44(8)"]
  depends_on: [OQ-014]
  rationale: >-
    Arabic Art 44(8): the employer may dismiss without notice on "تغيب العامل دون سبب مشروع أو
    عذر يقبله صاحب العمل لأكثر من (20) عشرين يومًا متقطعة خلال السنة الواحدة، أو أكثر من (7) سبعة
    أيام متتالية", after a written investigation and a written, reasoned decision (Art 44 opening
    words). The English omits "within one year" (خلال السنة الواحدة); OQ-014 decides the Arabic
