  scoring: [status, citations]
  reviewed: false
  refs: ["Labour Law Art 54(9)"]
  depends_on: []
  rationale: >-
    Art 54(9): "The case for any rights entitled under the provisions of this Law by Decree shall
    not be heard after the lapse of two years as of the date of work relation termination." This
