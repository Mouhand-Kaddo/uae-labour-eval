- id: cite-en-007
  category: cite
  language: en
  input: >-
    My employment contract includes a non-compete clause. Under UAE labour law, what is the
    longest period a non-compete can run after the contract ends, and does it still bind a
    worker whose contract is terminated during the probation period?
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "10"}
      - {instrument: executive-regulations, article: "12"}
  scoring: [status, citations]
  reviewed: false
  refs: ["Labour Law Art 10(1)", "Executive Regulations Art 12(5)"]
  depends_on: []
  rationale: >-
    Art 10(1): "the period of non-competition shall not exceed two years as of the expiry date of
    the contract." ER Art 12(5): "The worker shall be exempted from the non-compete clause ... b.
    If the contract is terminated during the probation period." The second half needs the
    Executive Regulations, so both instruments must be cited.
- id: cite-en-008
  category: cite
  language: en
  input: >-
    I have worked for the same Dubai company since 2016 on an unlimited contract with no end
    date. Is an unlimited contract still governed by the current Labour Law, and was my employer
    required to change it?
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "68"}
  scoring: [status, citations, "judge:grounding"]
  reviewed: false
  refs: ["Labour Law Art 68(1)", "Labour Law Art 68(2)"]
  depends_on: []
  rationale: >-
    Trap on unlimited contracts. Art 68(1): "The provisions of this Decree by law shall apply to
    indefinite-term employment contracts concluded in accordance with the aforementioned Federal
    Law No. (8) of 1980." Art 68(2): employers "must rectify their situation and convert
    indefinite-term employment contracts into fixed-term employment contracts ... within one year
    as of the date of its entry into force; and the Minister may extend this period". The judge
    fails an answer that says unlimited contracts simply carry on under the 1980 law or that
    states 1980-law rules, which are not in the corpus.
- id: cite-en-009
  category: cite
  language: en
  input: >-
    I'm a foreign worker, full-time for three and a half years, and I plan to resign. A friend
    says resigning means losing part of my end-of-service gratuity. Does the UAE Labour Law
    reduce the gratuity when the worker is the one who resigns?
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "51"}
  scoring: [status, citations, "judge:grounding"]
  reviewed: false
  refs: ["Labour Law Art 51(2)", "Labour Law Art 51(3)"]
  depends_on: []
  rationale: >-
    Trap on resignation vs termination: the correct answer is "no difference". Art 51(2): the
    foreign full-time worker "who has completed one or more years of continuous service, is
    entitled to an end-of-service gratuity upon the end of his service", 21 days' basic wage per
    year for the first five years; 51(3) adds parts of a year. Nothing in Art 51 turns on which
    party ended the contract, so the judge fails any claim that resignation cuts the gratuity.
- id: cite-en-010
  category: cite
  language: en
  input: >-
    What fine can an employer face under the UAE Labour Law for employing a worker who has no
    permit to work for that employer?
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "60"}
  scoring: [status, citations]
  reviewed: false
  refs: ["Labour Law Art 60(1)"]
  depends_on: [OQ-007]
  rationale: >-
    Art 60(1)(a) "Employs a Worker with no permit to work for him." The English gives the fine as
    "not less than on hundred thousand AED (100,000) and not exceeding two million AED
    (1,000,000)"; the Arabic says "لا تقل عن (100,000) مائة ألف درهم ولا تزيد على (1,000,000)
    مليون درهم". Expected answer: AED 100,000 to AED 1,000,000 (OQ-007, decided with high
    confidence from the Arabic, the English numeral and Art 60(2)); "one million" is correct.
