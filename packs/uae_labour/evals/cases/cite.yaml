- id: cite-en-001
  category: cite
  language: en
  input: >-
    Under the UAE Labour Law, what is the longest probation period an employer can set, and how
    much written notice must the employer give to end a worker's employment during probation?
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "9"}
  scoring: [status, citations]
  reviewed: false
  refs: ["Labour Law Art 9(1)"]
  depends_on: []
  rationale: >-
    Art 9(1): "The Employer may appoint the Worker under the Probation Period for a period not
    exceeding six (6) months as of the date of commencing work, and he may terminate the
    Worker's service during this period after notifying the Worker in writing at least fourteen
    (14) days prior to the date specified for termination of service." Both facts come from Art 9, so the answer must cite Labour Law Art 9 and
    every cited article must appear in a chunk retrieved during the case.
- id: cite-en-002
  category: cite
  language: en
  input: >-
    Under the UAE Labour Law's Executive Regulations, when a worker's service ends, on which wage
    is the cash payment for their unused annual leave balance calculated?
  expected:
    status: answered
    citations:
      - {instrument: executive-regulations, article: "19"}
  scoring: [status, citations]
  reviewed: false
  refs: ["Executive Regulations Art 19(2)"]
  depends_on: []
  rationale: >-
    ER Art 19(2): "In the event the worker's service is terminated, he shall be entitled to
    receive a cash equivalent of the balance of his annual leaves due by law in accordance with
    his basic salary." The answer comes from the Executive Regulations, so it must cite ER Art 19,
    and every cited article must appear in a chunk retrieved during the case.
- id: cite-ar-001
  category: cite
  language: ar
  input: >-
    انقطعت عن العمل بدون أجر لمدة شهرين خلال خدمتي لدى شركة خاصة. هل تُحسب أيام الانقطاع هذه ضمن
    مدة الخدمة عند حساب مكافأة نهاية الخدمة وفق قانون العمل الإماراتي؟
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "51"}
  scoring: [status, citations, answer_language]
  reviewed: false
  refs: ["Labour Law Art 51(4)"]
  depends_on: []
  rationale: >-
    Art 51(4) (Arabic text): "لا تدخل أيام الانقطاع عن العمل بدون أجر في حساب مدة الخدمة." The
    answer is no: the two months of unpaid absence are left out of the service on which the
    gratuity is calculated. The rule is in Art 51, so the answer must cite Labour Law Art 51,
    every cited article must have been retrieved during the case, and the answer must be in
    Arabic like the question.
- id: cite-en-003
  category: cite
  language: en
  input: >-
    My wife passed away last week. How many days of paid leave does the UAE Labour Law give me,
    and would it have been different if it had been my father who died?
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "32"}
  scoring: [status, citations]
  reviewed: false
  refs: ["Labour Law Art 32(1)"]
  depends_on: []
  rationale: >-
    Art 32(1)(a): "A mourning leave of five (5) days, in the event of the death of the spouse;
    and Three (3) days in the event of the death of the mother, father, son, brother, sister,
    grandson, grandfather or grandmother, starting as of the date of death." Five days for a
    spouse, three for a father. A statutory entitlement from stated facts, so it is answered,
    not refused as legal advice.
- id: cite-en-004
  category: cite
  language: en
  input: >-
    My employer often asks me to stay after my normal hours. What is the minimum extra pay the
    UAE Labour Law requires for overtime, and does the rate change if the overtime is late at
    night?
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "19"}
  scoring: [status, citations]
  reviewed: false
  refs: ["Labour Law Art 19(2)", "Labour Law Art 19(3)"]
  depends_on: []
  rationale: >-
    Art 19(2): overtime is paid at the wage for normal hours "calculated according to the basic
    wage - plus an increase of at least twenty-five percent (25%) of such wage". Art 19(3):
    overtime "between 10 pm and 4 am" carries an increase "equal to at least fifty percent
    (50%)", and "Shift Workers shall be excluded from the above."
- id: cite-en-005
  category: cite
  language: en
  input: >-
