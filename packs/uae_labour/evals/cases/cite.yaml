- id: cite-en-001
  category: cite
  language: en
  input: >-
    Under the UAE Labour Law, what is the longest probation period an employer can set, and how
    much written notice must the employer give to end a worker's employment during probation?
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "9"}
  scoring: [status, citations]
  reviewed: false
  refs: ["Labour Law Art 9(1)"]
  depends_on: []
  rationale: >-
    Art 9(1): "The Employer may appoint the Worker under the Probation Period for a period not
    exceeding six (6) months as of the date of commencing work, and he may terminate the
    Worker's service during this period after notifying the Worker in writing at least fourteen
    (14) days prior to the date specified for termination of service." Both facts come from Art 9, so the answer must cite Labour Law Art 9 and
    every cited article must appear in a chunk retrieved during the case.
- id: cite-en-002
  category: cite
  language: en
  input: >-
    Under the UAE Labour Law's Executive Regulations, when a worker's service ends, on which wage
    is the cash payment for their unused annual leave balance calculated?
  expected:
    status: answered
    citations:
      - {instrument: executive-regulations, article: "19"}
  scoring: [status, citations]
  reviewed: false
  refs: ["Executive Regulations Art 19(2)"]
  depends_on: []
  rationale: >-
    ER Art 19(2): "In the event the worker's service is terminated, he shall be entitled to
    receive a cash equivalent of the balance of his annual leaves due by law in accordance with
    his basic salary." The answer comes from the Executive Regulations, so it must cite ER Art 19,
    and every cited article must appear in a chunk retrieved during the case.
- id: cite-ar-001
  category: cite
  language: ar
  input: >-
    وفق قانون العمل الإماراتي، كم يومًا من الأجر يستحقها العامل الأجنبي بدوام كامل عن كل سنة من
    سنوات الخدمة الخمس الأولى في مكافأة نهاية الخدمة، وعلى أي أجر تُحسب المكافأة؟
  expected:
    status: answered
    citations:
      - {instrument: labour-law, article: "51"}
  scoring: [status, citations, answer_language]
  reviewed: false
  refs: ["Labour Law Art 51(2)"]
  depends_on: []
  rationale: >-
    Art 51(2) (Arabic text): "يستحق العامل الأجنبي الذي يعمل وفق نمط العمل بالدوام الكامل، والذي
    أكمل سنة أو أكثر في الخدمة المستمرة مكافأة نهاية الخدمة عند انتهاء خدمته، تحسب وفق الأجر
    الأساسي، وذلك على النحو الآتي: أ. أجر (21) واحد وعشرين يوم عن كل سنة من سنوات الخدمة الخمس
    الأولى." Both facts (21 days, basic wage) come from Art 51, so the answer must cite Labour Law
    Art 51, every cited article must have been retrieved during the case, and the answer must be
    in Arabic like the question.
