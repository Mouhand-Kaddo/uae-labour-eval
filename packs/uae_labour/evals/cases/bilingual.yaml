      entitled to under the Saudi labour law?
    ar: >-
      أعمل لدى شركة خاصة في الرياض بالمملكة العربية السعودية. كم يومًا من الإجازة السنوية أستحق وفق
      نظام العمل السعودي؟
  expected:
    en: &refuse-scope-001
      status: refused
      refusal_reason: out_of_scope
    ar: *refuse-scope-001
  scoring: [status, "judge:refusal", answer_language, consistency]
  reviewed: false
  refs: []
  depends_on: []
