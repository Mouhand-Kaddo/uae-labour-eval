- id: bilingual-gratuity-001
  category: bilingual
  language: both
  input:
    en: >-
      I'm a foreign worker on a full-time contract. I started work on 1 January 2020 and my last
      day of work was 31 December 2022. My basic wage is AED 7,300 a month and my total wage with
      allowances is AED 10,000. How much end-of-service gratuity am I owed?
    ar: >-
      أنا عامل أجنبي بعقد دوام كامل. بدأت العمل في 1 يناير 2020 وكان آخر يوم عمل لي 31 ديسمبر
      2022. أجري الأساسي 7,300 درهم شهريًا وأجري الإجمالي مع البدلات 10,000 درهم. ما مقدار مكافأة
      نهاية الخدمة المستحقة لي؟
  expected:
    en: &gratuity-001
      status: answered
      numbers: [15133.81]
      tolerance: 1
      citations: [{instrument: labour-law, article: "51"}]
      tool_call:
        name: calculate_gratuity
        arguments:
          start_date: "2020-01-01"
          end_date: "2022-12-31"
          monthly_basic_wage: 7300
          work_pattern: full_time
          nationality: foreign
    ar: *gratuity-001
  scoring: [status, numeric, citations, tool_call, answer_language, consistency]
  reviewed: false
  refs: ["Labour Law Art 51(2)", "Labour Law Art 51(3)", "Labour Law Art 67"]
  depends_on: [OQ-001, OQ-002]
  rationale: >-
    2020 is a leap year: 366 + 365 + 365 = 1,096 days, more than one year of 365 days (Art 67),
    all within the first five years at 21 days a year (Art 51(2)(a)), the part year pro-rated
    (Art 51(3)). On the basic wage, not the AED 10,000: daily basic wage (OQ-001) = 7,300 × 12 /
    365 = 240. 1,096 × 21 / 365 × 240 = 5,523,840 / 365 = AED 15,133.81. Cap 24 × 7,300 =
    175,200 not reached. Both halves state the same facts, so both must give AED 15,133.81, both
    cite Art 51 and mean the same.

- id: bilingual-leave-001
  category: bilingual
  language: both
  input:
    en: >-
      My employment ends on 31 March 2025. I started on 1 April 2024 and took 10 days of annual
      leave in that time. My basic salary is AED 7,300 a month and my total salary with
      allowances is AED 10,000. How much should I be paid for my unused annual leave?
    ar: >-
      تنتهي خدمتي في 31 مارس 2025. بدأت العمل في 1 أبريل 2024 وحصلت على 10 أيام من إجازتي السنوية
      خلال هذه المدة. أجري الأساسي 7,300 درهم شهريًا وأجري الإجمالي مع البدلات 10,000 درهم. كم يجب
      أن يُدفع لي بدلًا عن رصيد إجازتي السنوية غير المستخدم؟
  expected:
    en: &leave-001
      status: answered
      numbers: [4800]
      tolerance: 1
      citations: [{instrument: executive-regulations, article: "19"}]
      tool_call:
        name: calculate_annual_leave
        arguments:
          start_date: "2024-04-01"
          end_date: "2025-03-31"
          leave_days_taken: 10
          monthly_basic_wage: 7300
    ar: *leave-001
  scoring: [status, numeric, citations, tool_call, answer_language, consistency]
  reviewed: false
  refs: ["Labour Law Art 29(1)", "Executive Regulations Art 19(2)"]
  depends_on: [OQ-001, OQ-003]
  rationale: >-
    Apr–Dec 2024 = 275 days, plus 31 + 28 + 31 = 365 days = one year (Art 67): 30 days' leave
    (Art 29(1)). Balance 30 − 10 = 20 days. On termination the cash-out is on the basic wage
    (ER Art 19(2), OQ-003): daily basic wage (OQ-001) = 7,300 × 12 / 365 = 240. 20 × 240 =
    AED 4,800 (the AED 10,000 wage would give 6,575.34). Both halves must give AED 4,800, both
    cite ER Art 19 and mean the same.

- id: bilingual-notice-001
  category: bilingual
  language: both
  input:
    en: >-
      My contract has a 30-day notice period. My employer gave me written notice of termination,
      but after I had worked 10 days of it they told me to leave immediately and stopped paying
      me. My total monthly wage with allowances is AED 9,125 and my basic wage is AED 6,500. How
      much pay in lieu of notice am I owed?
    ar: >-
      مدة الإنذار في عقدي 30 يومًا. أخطرني صاحب العمل كتابيًا بإنهاء العقد، وبعد أن عملت 10 أيام من
      مدة الإنذار طلب مني المغادرة فورًا وأوقف أجري. أجري الشهري الإجمالي مع البدلات 9,125 درهمًا
      وأجري الأساسي 6,500 درهم. كم بدل الإنذار المستحق لي؟
  expected:
    en: &notice-001
      status: answered
      numbers: [6000]
      tolerance: 1
      citations: [{instrument: labour-law, article: "43"}]
      tool_call:
        name: check_notice_period
        arguments:
          notice_days: 30
          notice_days_worked: 10
          monthly_wage: 9125
    ar: *notice-001
  scoring: [status, numeric, citations, tool_call, answer_language, consistency]
  reviewed: false
  refs: ["Labour Law Art 43(1)", "Labour Law Art 43(3)", "Labour Law Art 43(4)"]
  depends_on: [OQ-001]
  rationale: >-
    30 days is within 30–90 (Art 43(1)). The employer did not honour the rest of the notice
    period, so it owes the wage for the remaining part (Art 43(3)): 30 − 10 = 20 days, on the
    last wage including allowances, not the basic wage (Art 43(4)). Daily wage (OQ-001) =
    9,125 × 12 / 365 = 300. 20 × 300 = AED 6,000. Both halves must give AED 6,000, both cite
    Art 43 and mean the same.

- id: bilingual-probation-001
  category: bilingual
  language: both
  input:
    en: >-
      I started work on 1 January 2025 on a 6-month probation period. On 1 March 2025 my
      employer told me in writing that my last day would be 6 March 2025. My monthly wage is
      AED 7,300. Was that enough notice, and if not, what compensation am I owed?
    ar: >-
      بدأت العمل في 1 يناير 2025 بفترة تجربة مدتها 6 أشهر. في 1 مارس 2025 أخطرني صاحب العمل
      كتابيًا بأن آخر يوم عمل لي
      سيكون 6 مارس 2025. أجري الشهري 7,300 درهم. هل كان الإخطار كافيًا؟ وإن لم يكن، فما التعويض
      المستحق لي؟
  expected:
    en: &probation-001
      status: answered
      numbers: [2160]
      tolerance: 1
      citations: [{instrument: labour-law, article: "9"}]
      tool_call:
        name: check_probation
        arguments:
          start_date: "2025-01-01"
          ended_by: employer
          notice_date: "2025-03-01"
          termination_date: "2025-03-06"
          monthly_wage: 7300
    ar: *probation-001
  scoring: [status, numeric, citations, tool_call, answer_language, consistency]
  reviewed: false
  refs: ["Labour Law Art 9(1)", "Labour Law Art 9(5)", "Labour Law Art 67"]
  depends_on: [OQ-001]
  rationale: >-
    1 Jan to 6 Mar 2025 = 65 days, within the 180-day probation maximum (Art 9(1), Art 67).
    Art 9(1): the employer must give at least 14 days' written notice during probation. 1 to
    6 March is 5 days, 9 days short. Art 9(5): compensation equals the worker's wage for the
    remaining notice period. Daily wage (OQ-001) = 7,300 × 12 / 365 = 240. 9 × 240 =
    AED 2,160. Both halves must say the notice was not enough, give AED 2,160, both cite Art 9
    and mean the same.

- id: bilingual-cite-probation-001
  category: bilingual
  language: both
  input:
    en: >-
      Under the UAE Labour Law, if a worker on probation wants to move to another employer in the
      UAE, how much written notice must they give their current employer, and who pays the
      current employer's costs of recruiting them?
    ar: >-
      وفق قانون العمل الإماراتي، إذا رغب العامل خلال فترة التجربة في الانتقال للعمل لدى صاحب عمل آخر
      في الدولة، فما مدة الإخطار الكتابي التي يجب أن يمنحها لصاحب العمل الحالي، ومن يتحمل تكاليف
      استقدامه؟
  expected:
    en: &cite-probation-001
      status: answered
      citations:
        - {instrument: labour-law, article: "9"}
    ar: *cite-probation-001
  scoring: [status, citations, answer_language, consistency]
  reviewed: false
  refs: ["Labour Law Art 9(3)"]
  depends_on: []
  rationale: >-
    Art 9(3): "he must notify the original Employer in writing within a period not less than one
    month ... The new Employer shall compensate the original Employer with the costs of
    recruiting or contracting with the Worker, unless agreed otherwise." Arabic: "يجب عليه إخطار
    صاحب العمل الأصلي بذلك خطيًّا بمدة لا تقل عن شهر ... ويلتزم صاحب العمل الجديد بتعويض صاحب
    العمل الأصلي بتكاليف الاستقدام أو التعاقد مع العامل، ما لم يتم الاتفاق على خلاف ذلك." Both
    halves must cite Art 9 (retrieved in that half) and say the same thing: at least one
    month, the new employer pays unless agreed otherwise.

- id: bilingual-cite-notice-001
  category: bilingual
  language: both
  input:
    en: >-
      Under the UAE Labour Law, what are the shortest and the longest notice periods an
      employment contract may set for either party to end it?
    ar: >-
      وفق قانون العمل الإماراتي، ما أقصر وأطول مدة إنذار يجوز أن يحددها عقد العمل لإنهائه من أي من
      الطرفين؟
  expected:
    en: &cite-notice-001
      status: answered
      citations:
        - {instrument: labour-law, article: "43"}
    ar: *cite-notice-001
  scoring: [status, citations, answer_language, consistency]
  reviewed: false
  refs: ["Labour Law Art 43(1)"]
  depends_on: []
  rationale: >-
    Art 43(1): "provided that the period is not less than thirty (30) days, and not more than
