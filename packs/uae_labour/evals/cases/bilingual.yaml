- id: bilingual-cite-gratuity-001
  category: bilingual
  language: both
  input:
    en: >-
      Under the UAE Labour Law, how many days' wage per year of service does a full-time foreign
      worker's end-of-service gratuity give for the first five years, how many for each year
      after that, and on which wage is it calculated?
    ar: >-
      وفق قانون العمل الإماراتي، كم يومًا من الأجر عن كل سنة خدمة تمنحها مكافأة نهاية الخدمة للعامل
      الأجنبي بدوام كامل عن السنوات الخمس الأولى، وكم يومًا عن كل سنة بعدها، وعلى أي أجر تُحسب؟
  expected:
    en: &cite-gratuity-001
      status: answered
      citations:
        - {instrument: labour-law, article: "51"}
    ar: *cite-gratuity-001
  scoring: [status, citations, answer_language, consistency]
  reviewed: false
  refs: ["Labour Law Art 51(2)"]
  depends_on: []
  rationale: >-
    Art 51(2): "calculated according to the basic wage, as follows: a. The wage of twenty-one
    (21) days for each year of the first five years of service. b. The wage of thirty (30) days
    for each year in excess of that." Arabic: "تحسب وفق الأجر الأساسي ... أ. أجر (21) واحد
    وعشرين يوم عن كل سنة من سنوات الخدمة الخمس الأولى. ب. أجر (30) ثلاثين يوم عن كل سنة مما زاد
    على ذلك." Both halves must cite Art 51 and give 21 days, 30 days and the basic wage.

- id: bilingual-cite-leave-001
  category: bilingual
  language: both
  input:
    en: >-
      Under the Executive Regulations of the UAE Labour Law, how much of a year's annual leave
      may a worker carry forward into the next year, and on which wage is cash for the unused
      leave balance paid when their service ends?
    ar: >-
      وفق اللائحة التنفيذية لقانون العمل الإماراتي، ما المقدار الذي يجوز للعامل ترحيله من إجازته
      السنوية إلى السنة التالية، وعلى أي أجر يُصرف البدل النقدي عن رصيد إجازاته عند انتهاء خدمته؟
  expected:
    en: &cite-leave-001
      status: answered
      citations:
        - {instrument: executive-regulations, article: "19"}
    ar: *cite-leave-001
  scoring: [status, citations, answer_language, consistency]
  reviewed: false
  refs: ["Executive Regulations Art 19(1)", "Executive Regulations Art 19(2)"]
  depends_on: []
  rationale: >-
    ER Art 19(1): "The worker may carry forward, into the following year, what does not exceed
    half of the annual leave"; ER Art 19(2): "In the event the worker's service is terminated,
    he shall be entitled to receive a cash equivalent of the balance of his annual leaves due by
    law in accordance with his basic salary." Arabic: "يجوز للعامل ترحيل ما لا يزيد على نصف
    الإجازة السنوية للسنة التي تليها" and "في حالة انتهاء خدمة العامل يصرف له بدل نقدي عن رصيد
    إجازاته السنوية المستحقة قانونًا وفقًا للأجر الأساسي." Both halves must cite ER Art 19 and
    give half the leave and the basic wage.

