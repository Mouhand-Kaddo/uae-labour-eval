- id: calc-gratuity-ar-007
  category: calc
  language: ar
  input: >-
    أعمل بدوام جزئي 24 ساعة أسبوعيًا، بينما الدوام الكامل في الشركة 40 ساعة أسبوعيًا. عملت من
    1 يناير 2020 حتى 31 ديسمبر 2022، وأنا عامل أجنبي وأجري الأساسي 7,300 درهم شهريًا. ما مكافأة
    نهاية الخدمة؟
  expected:
    status: answered
    numbers: [9080.28]
    tolerance: 1
    tool_call:
      name: calculate_gratuity
      arguments:
        start_date: "2020-01-01"
        end_date: "2022-12-31"
        monthly_basic_wage: 7300
        work_pattern: part_time
        part_time_hours_ratio: 0.6
        nationality: foreign
  scoring: [status, numeric, tool_call]
  reviewed: false
  refs: ["Executive Regulations Art 30", "Labour Law Art 51(2)", "Labour Law Art 51(3)"]
  depends_on: [OQ-001, OQ-002, OQ-008]
  rationale: >-
    366 + 365 + 365 = 1,096 days. Daily basic wage 7,300 × 12 / 365 = 240. Full-time value
    1,096 × 21 / 365 × 240 = 5,523,840 / 365 = 15,133.81. ER Art 30(1): 24 / 40 = 60% of
    the hours (the same ratio per year); 5,523,840 × 0.6 / 365 = 3,314,304 / 365 =
    AED 9,080.28. Depends on OQ-008.
