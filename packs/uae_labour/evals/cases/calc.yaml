- id: calc-notice-en-002
  category: calc
  language: en
  input: >-
    My new employment contract in Abu Dhabi sets a notice period of 14 days for both sides.
    Is that allowed under the UAE Labour Law?
  expected:
    status: answered
    tool_call:
      name: check_notice_period
      arguments:
        notice_days: 14
  scoring: [status, tool_call]
  reviewed: false
  refs: ["Labour Law Art 43(1)", "Labour Law Art 65(3)"]
  depends_on: [OQ-012]
  rationale: >-
    Art 43(1): the agreed notice period must be not less than 30 days and not more than 90.
    14 < 30, so the clause is below the legal minimum. OQ-012 (decided): a term that hurts the
    worker gives way to the nearest limit and one that helps the worker stands (Art 65(3)).
    Expected answer: not allowed as a term; if the employer ends the contract, 30 days' notice
    apply; if the worker resigns, the 14 days stand.

